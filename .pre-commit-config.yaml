repos:
  - repo: https://github.com/tekwizely/pre-commit-golang
    rev: v1.0.0-rc.4
    hooks:
      - id: go-fmt
      - id: go-vet-repo-mod
      - id: go-imports
      - id: golangci-lint-repo-mod
      - id: go-test-repo-mod
  - repo: local
    hooks:
      - id: loop-registry-claim-binding
        name: loop-registry claim binding
        entry: tools/loopregistry/precommit.sh
        language: script
        pass_filenames: false

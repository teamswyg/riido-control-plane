name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: false
      - name: Verify Go dependency allowlist
        run: |
          mkdir -p out
          go run ./tools/dependencyallowlist \
            -contract dependency_allowlist.riido.json \
            -evidence-out out/dependency-allowlist-evidence.json
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: dependency-allowlist-evidence
          path: out/dependency-allowlist-evidence.json
          if-no-files-found: error
      - name: Test
        run: go test ./...

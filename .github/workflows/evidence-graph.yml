name: Evidence Graph

on:
  pull_request:
    paths:
      - ".github/workflows/evidence-graph.yml"
      - ".github/workflows/harness-promotion.yml"
      - ".github/workflows/closed-loop-candidate-intake.yml"
      - ".github/workflows/closed-loop-candidate-decision.yml"
      - ".github/workflows/loop-registry.yml"
      - ".github/workflows/pre-commit-baseline.yml"
      - ".pre-commit-config.yaml"
      - "docs/20-domain/ai-agent-client-api.md"
      - "docs/20-domain/ai-agent-client-api.riido.json"
      - "docs/30-architecture/evidence-graph.md"
      - "docs/30-architecture/evidence-graph.riido.json"
      - "docs/30-architecture/harness-promotion.riido.json"
      - "docs/30-architecture/closed-loop-candidate-intake.riido.json"
      - "docs/30-architecture/closed-loop-candidate-decision.riido.json"
      - "docs/30-architecture/loop-registry.riido.json"
      - "docs/30-architecture/pre-commit-baseline.riido.json"
      - "internal/riidoaiserver/ai_agent_client_thread_history_api.go"
      - "internal/riidoaiserver/ai_agent_client_thread_history_projection.go"
      - "internal/riidoaiserver/ai_agent_client_thread_history_conversation_test.go"
      - "internal/riidoaiserver/ai_agent_client_http_v3_thread_history_test.go"
      - "go.mod"
      - "go.sum"
      - "tools/aiagentclientapi/**"
      - "tools/evidencegraph/**"
      - "tools/harnesspromotion/**"
      - "tools/closedloopcandidateintake/**"
      - "tools/closedloopcandidatedecision/**"
      - "tools/loopregistry/**"
      - "tools/precommitbaseline/**"
  push:
    branches: [main]
    paths:
      - ".github/workflows/evidence-graph.yml"
      - ".github/workflows/harness-promotion.yml"
      - ".github/workflows/closed-loop-candidate-intake.yml"
      - ".github/workflows/closed-loop-candidate-decision.yml"
      - ".github/workflows/loop-registry.yml"
      - ".github/workflows/pre-commit-baseline.yml"
      - ".pre-commit-config.yaml"
      - "docs/20-domain/ai-agent-client-api.md"
      - "docs/20-domain/ai-agent-client-api.riido.json"
      - "docs/30-architecture/evidence-graph.md"
      - "docs/30-architecture/evidence-graph.riido.json"
      - "docs/30-architecture/harness-promotion.riido.json"
      - "docs/30-architecture/closed-loop-candidate-intake.riido.json"
      - "docs/30-architecture/closed-loop-candidate-decision.riido.json"
      - "docs/30-architecture/loop-registry.riido.json"
      - "docs/30-architecture/pre-commit-baseline.riido.json"
      - "internal/riidoaiserver/ai_agent_client_thread_history_api.go"
      - "internal/riidoaiserver/ai_agent_client_thread_history_projection.go"
      - "internal/riidoaiserver/ai_agent_client_thread_history_conversation_test.go"
      - "internal/riidoaiserver/ai_agent_client_http_v3_thread_history_test.go"
      - "go.mod"
      - "go.sum"
      - "tools/aiagentclientapi/**"
      - "tools/evidencegraph/**"
      - "tools/harnesspromotion/**"
      - "tools/closedloopcandidateintake/**"
      - "tools/closedloopcandidatedecision/**"
      - "tools/loopregistry/**"
      - "tools/precommitbaseline/**"

jobs:
  evidence-graph:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
      - run: go test ./tools/evidencegraph -count=1
      - run: mkdir -p out
      - run: go run ./tools/evidencegraph -check-doc -evidence-out out/evidence-graph-evidence.json
      - uses: actions/upload-artifact@v7
        with:
          name: evidence-graph-evidence
          path: out/evidence-graph-evidence.json
          if-no-files-found: error

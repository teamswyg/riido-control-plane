      - "docs/30-architecture/control-plane-high-traffic-audit.riido.json"
      - "docs/30-architecture/loop-closure-audit.md"
      - "docs/30-architecture/loop-closure-audit.riido.json"
      - "docs/30-architecture/fixtures/performance-failure-summary.fixture.json"
      - "docs/50-roadmap/open-questions.riido.json"
      - "internal/riidoaiserver/**"
      - "internal/riidoaiserver/ai_agent_client_thread_history_api.go"

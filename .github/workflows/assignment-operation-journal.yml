name: assignment-operation-journal

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/assignment-operation-journal.yml"
      - "docs/20-domain/assignment-operation-journal.md"
      - "docs/20-domain/assignment-operation-journal.riido.json"
      - "docs/20-domain/saas-control-plane.md"
      - "docs/migration/control-plane.md"
      - "tools/assignmentjournal/**"
      - "go.mod"
      - "go.sum"
      - "internal/riidoaiserver/doc.go"
      - "internal/riidoaiserver/assignment_api.go"
      - "internal/riidoaiserver/assignment_contract_gen.go"
      - "internal/riidoaiserver/assignment_operation_port.go"
      - "internal/riidoaiserver/assignment_operation_port_test.go"
  pull_request:
    paths:
      - ".github/workflows/assignment-operation-journal.yml"
      - "docs/20-domain/assignment-operation-journal.md"
      - "docs/20-domain/assignment-operation-journal.riido.json"
      - "docs/20-domain/saas-control-plane.md"
      - "docs/migration/control-plane.md"
      - "tools/assignmentjournal/**"
      - "go.mod"
      - "go.sum"
      - "internal/riidoaiserver/doc.go"
      - "internal/riidoaiserver/assignment_api.go"
      - "internal/riidoaiserver/assignment_contract_gen.go"
      - "internal/riidoaiserver/assignment_operation_port.go"
      - "internal/riidoaiserver/assignment_operation_port_test.go"

jobs:
  journal:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false
      - name: Verify Go dependency allowlist
        run: go run ./tools/dependencyallowlist -contract dependency_allowlist.riido.json
      - name: Verify assignment journal import boundary
        run: |
          disallowed="$(go list -deps -f '{{if not .Standard}}{{.ImportPath}}{{end}}' ./internal/riidoaiserver | grep -E 'github.com/teamswyg/riido_daemon|github.com/teamswyg/riido-daemon|github.com/aws|internal/(dynamodb|terraform|infra)' || true)"
          if [ -n "$disallowed" ]; then
            printf 'Disallowed assignment journal imports:\n%s\n' "$disallowed"
            exit 1
          fi
      - name: Verify assignment journal executable SSOT
        run: |
          mkdir -p out
          go test ./tools/assignmentjournal -count=1
          go run ./tools/assignmentjournal \
            -check-doc \
            -evidence-out out/assignment-operation-journal-evidence.json
      - name: Test assignment operation journal
        run: go test ./internal/riidoaiserver -run 'AssignmentOperation|AssignmentActiveLease' -count=1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: assignment-operation-journal-evidence
          path: out/assignment-operation-journal-evidence.json
          if-no-files-found: error

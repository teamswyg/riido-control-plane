name: architecture-docs

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/architecture-docs.yml"
      - "docs/20-domain/ai-agent-client-api.md"
      - "docs/20-domain/context-map.md"
      - "docs/30-architecture/**"
      - "docs/50-roadmap/open-questions.md"
      - "docs/migration/control-plane.md"
      - "cmd/riido_ai_server/main.go"
      - "internal/riidoaiserver/doc.go"
      - "tools/aiagentrisk/**"
      - "tools/apiclientdelivery/**"
      - "tools/configreference/**"
      - "tools/integrationmatrix/**"
      - "tools/liveworkflowevidence/**"
      - "tools/moduledecomposition/**"
      - "tools/openquestions/**"
      - "tools/runtimeboundary/**"
      - "tools/runtimecdownership/**"
      - "tools/snapshotcqrsgate/**"
  pull_request:
    paths:
      - ".github/workflows/architecture-docs.yml"
      - "docs/20-domain/ai-agent-client-api.md"
      - "docs/20-domain/context-map.md"
      - "docs/30-architecture/**"
      - "docs/50-roadmap/open-questions.md"
      - "docs/migration/control-plane.md"
      - "cmd/riido_ai_server/main.go"
      - "internal/riidoaiserver/doc.go"
      - "tools/aiagentrisk/**"
      - "tools/apiclientdelivery/**"
      - "tools/configreference/**"
      - "tools/integrationmatrix/**"
      - "tools/liveworkflowevidence/**"
      - "tools/moduledecomposition/**"
      - "tools/openquestions/**"
      - "tools/runtimeboundary/**"
      - "tools/runtimecdownership/**"
      - "tools/snapshotcqrsgate/**"

jobs:
  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false
      - name: Verify required architecture docs
        run: |
          test -f docs/20-domain/context-map.md
          test -f docs/20-domain/ai-agent-client-api.md
          test -f docs/30-architecture/api-client-delivery.md
          test -f docs/30-architecture/api-client-delivery.riido.json
          test -f docs/30-architecture/module-decomposition.md
          test -f docs/30-architecture/config-reference.md
          test -f docs/30-architecture/integration-matrix.md
          test -f docs/30-architecture/runtime-deployment-boundary.md
          test -f docs/30-architecture/runtime-deployment-boundary.riido.json
          test -f docs/30-architecture/runtime-cd-ownership.md
          test -f docs/30-architecture/runtime-cd-ownership.riido.json
          test -f docs/30-architecture/live-workflow-redaction.md
          test -f docs/30-architecture/live-workflow-redaction.riido.json
          test -f docs/30-architecture/ai-agent-risk-evidence.riido.json
          test -f docs/30-architecture/ai-agent-snapshot-cqrs-gate.riido.json
          test -f docs/50-roadmap/open-questions.md
          test -f docs/50-roadmap/open-questions.riido.json
      - name: Verify architecture docs avoid stale ownership paths
        run: |
          stale="$(grep -R --line-number -E 'github.com/teamswyg/riido_daemon|github.com/teamswyg/riido-daemon/internal|packaging/terraform|terraform\\.tfstate|terraform\\.tfvars|AWS_ACCESS_KEY|AWS_SECRET' docs/20-domain/context-map.md docs/30-architecture docs/50-roadmap || true)"
          if [ -n "$stale" ]; then
            printf 'Stale/private ownership wording found:\n%s\n' "$stale"
            exit 1
          fi
      - name: Verify config reference
        run: |
          go run ./tools/configreference \
            -check-doc \
            -evidence-out out/config-reference-evidence.json
      - name: Verify API client delivery
        run: |
          go run ./tools/apiclientdelivery \
            -check-doc \
            -evidence-out out/api-client-delivery-evidence.json
      - name: Verify integration matrix
        run: |
          go run ./tools/integrationmatrix \
            -check-doc \
            -evidence-out out/integration-matrix-evidence.json
      - name: Verify module decomposition
        run: |
          go run ./tools/moduledecomposition \
            -check-doc \
            -evidence-out out/module-decomposition-evidence.json
      - name: Verify open questions
        run: |
          go run ./tools/openquestions \
            -check-doc \
            -evidence-out out/open-questions-evidence.json
      - name: Verify runtime deployment boundary
        run: |
          go run ./tools/runtimeboundary \
            -check-doc \
            -evidence-out out/runtime-deployment-boundary-evidence.json
      - name: Verify runtime CD ownership
        run: |
          go run ./tools/runtimecdownership \
            -check-doc \
            -evidence-out out/runtime-cd-ownership-evidence.json
      - name: Verify live workflow redaction evidence
        run: |
          go run ./tools/liveworkflowevidence \
            -check-doc \
            -evidence-out out/live-workflow-redaction-evidence.json
      - name: Verify Go dependency allowlist
        run: go run ./tools/dependencyallowlist -contract dependency_allowlist.riido.json
      - name: Verify AI Agent risk evidence
        run: |
          mkdir -p out
          go run ./tools/aiagentrisk -evidence-out out/ai-agent-risk-evidence.json
          go test ./tools/aiagentrisk -count=1
      - name: Upload AI Agent risk evidence
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ai-agent-risk-evidence
          path: out/ai-agent-risk-evidence.json
          if-no-files-found: warn
      - name: Upload config reference evidence
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: config-reference-evidence
          path: out/config-reference-evidence.json
          if-no-files-found: warn
      - name: Upload API client delivery evidence
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: api-client-delivery-evidence
          path: out/api-client-delivery-evidence.json
          if-no-files-found: warn
      - name: Upload integration matrix evidence
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: integration-matrix-evidence
          path: out/integration-matrix-evidence.json
          if-no-files-found: warn
      - name: Upload module decomposition evidence
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: module-decomposition-evidence
          path: out/module-decomposition-evidence.json
          if-no-files-found: warn
      - name: Upload open questions evidence
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: open-questions-evidence
          path: out/open-questions-evidence.json
          if-no-files-found: warn
      - name: Upload runtime deployment boundary evidence
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: runtime-deployment-boundary-evidence
          path: out/runtime-deployment-boundary-evidence.json
          if-no-files-found: warn
      - name: Upload runtime CD ownership evidence
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: runtime-cd-ownership-evidence
          path: out/runtime-cd-ownership-evidence.json
          if-no-files-found: warn
      - name: Upload live workflow redaction evidence
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: live-workflow-redaction-evidence
          path: out/live-workflow-redaction-evidence.json
          if-no-files-found: warn
      - name: Verify AI Agent snapshot CQRS gate
        run: |
          mkdir -p out
          go run ./tools/snapshotcqrsgate -check-doc -evidence-out out/snapshot-cqrs-gate-evidence.json
          go test ./tools/snapshotcqrsgate -count=1
      - name: Upload AI Agent snapshot CQRS gate evidence
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: snapshot-cqrs-gate-evidence
          path: out/snapshot-cqrs-gate-evidence.json
          if-no-files-found: warn
      - name: Test
        run: go test ./...

name: module-decomposition

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/module-decomposition.yml"
      - "awsadapters/**"
      - "cmd/**"
      - "internal/**"
      - "tools/**"
      - "docs/30-architecture/module-decomposition.md"
      - "docs/30-architecture/module-decomposition.riido.json"
      - "docs/executable-knowledge.md"
      - "docs/executable-knowledge.riido.json"
  pull_request:
    paths:
      - ".github/workflows/module-decomposition.yml"
      - "awsadapters/**"
      - "cmd/**"
      - "internal/**"
      - "tools/**"
      - "docs/30-architecture/module-decomposition.md"
      - "docs/30-architecture/module-decomposition.riido.json"
      - "docs/executable-knowledge.md"
      - "docs/executable-knowledge.riido.json"

jobs:
  module-decomposition:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: false
      - name: Verify Go dependency allowlist
        run: go run ./tools/dependencyallowlist -contract dependency_allowlist.riido.json
      - name: Verify module decomposition
        run: |
          mkdir -p out
          go test ./tools/moduledecomposition -count=1
          go run ./tools/moduledecomposition \
            -check-doc \
            -evidence-out out/module-decomposition-evidence.json
      - name: Verify executable knowledge coverage
        run: |
          go run ./tools/knowledgecoverage \
            -check-doc \
            -evidence-out out/executable-knowledge-coverage.json
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: module-decomposition-evidence
          path: |
            out/module-decomposition-evidence.json
            out/executable-knowledge-coverage.json
          if-no-files-found: error

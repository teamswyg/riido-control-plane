name: assignment-operation-replay

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/assignment-operation-replay.yml"
      - "docs/20-domain/assignment-operation-journal.md"
      - "docs/20-domain/saas-control-plane.md"
      - "docs/20-domain/saas-control-plane.riido.json"
      - "docs/migration/control-plane.md"
      - "tools/saascontrolplane/**"
      - "go.mod"
      - "go.sum"
      - "internal/riidoaiserver/assignment_api.go"
      - "internal/riidoaiserver/assignment_contract_gen.go"
      - "internal/riidoaiserver/assignment_operation_port.go"
      - "internal/riidoaiserver/assignment_operation_replay.go"
      - "internal/riidoaiserver/assignment_operation_replay_test.go"
      - "internal/riidoaiserver/store_state.go"
  pull_request:
    paths:
      - ".github/workflows/assignment-operation-replay.yml"
      - "docs/20-domain/assignment-operation-journal.md"
      - "docs/20-domain/saas-control-plane.md"
      - "docs/20-domain/saas-control-plane.riido.json"
      - "docs/migration/control-plane.md"
      - "tools/saascontrolplane/**"
      - "go.mod"
      - "go.sum"
      - "internal/riidoaiserver/assignment_api.go"
      - "internal/riidoaiserver/assignment_contract_gen.go"
      - "internal/riidoaiserver/assignment_operation_port.go"
      - "internal/riidoaiserver/assignment_operation_replay.go"
      - "internal/riidoaiserver/assignment_operation_replay_test.go"
      - "internal/riidoaiserver/store_state.go"

jobs:
  replay:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: false
      - name: Verify Go dependency allowlist
        run: go run ./tools/dependencyallowlist -contract dependency_allowlist.riido.json
      - name: Verify replay import boundary
        run: |
          disallowed="$(go list -deps -f '{{if not .Standard}}{{.ImportPath}}{{end}}' ./internal/riidoaiserver | grep -E 'github.com/teamswyg/riido_daemon|github.com/teamswyg/riido-daemon|github.com/aws|internal/(dynamodb|terraform|infra)' || true)"
          if [ -n "$disallowed" ]; then
            printf 'Disallowed replay imports:\n%s\n' "$disallowed"
            exit 1
          fi
      - name: Verify replay executable SSOT
        run: |
          mkdir -p out
          go test ./tools/saascontrolplane -count=1
          go run ./tools/saascontrolplane \
            -boundary assignment-operation-replay \
            -check-doc \
            -evidence-out out/assignment-operation-replay-evidence.json
      - name: Test assignment operation replay
        run: go test ./internal/riidoaiserver -run 'AssignmentOperationReplay|AssignmentOperationRecord|AssignmentOperationHelpers' -count=1
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: assignment-operation-replay-evidence
          path: out/assignment-operation-replay-evidence.json
          if-no-files-found: error

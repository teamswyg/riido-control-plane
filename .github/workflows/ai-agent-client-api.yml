name: ai-agent-client-api

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/ai-agent-client-api.yml"
      - ".github/workflows/generated-client-delivery.yml"
      - "contracts/ai-agent-client/**"
      - "docs/20-domain/ai-agent-client-api.md"
      - "docs/20-domain/ai-agent-client-api.riido.json"
      - "docs/20-domain/context-map.md"
      - "docs/20-domain/request-authorization.md"
      - "docs/30-architecture/api-client-delivery.md"
      - "docs/30-architecture/api-client-delivery.riido.json"
      - "docs/30-architecture/config-reference.md"
      - "docs/30-architecture/integration-matrix.md"
      - "docs/30-architecture/module-decomposition.md"
      - "docs/migration/control-plane.md"
      - "cmd/riido_ai_server/main.go"
      - "cmd/riido_ai_server/main_test.go"
      - "internal/riidoaiserver/ai_agent_client_*.go"
      - "internal/riidoaiserver/server.go"
      - "internal/riidoaiserver/authorization.go"
      - "tools/aiagentclientapi/**"
      - "tools/apiclientdelivery/**"
      - "tools/reactquerygen/**"
      - "tools/generatedclienthandoff/**"
      - "web/generated/aiAgentClient.ts"
      - "web/generated/aiAgentClient.react.ts"
  pull_request:
    paths:
      - ".github/workflows/ai-agent-client-api.yml"
      - ".github/workflows/generated-client-delivery.yml"
      - "contracts/ai-agent-client/**"
      - "docs/20-domain/ai-agent-client-api.md"
      - "docs/20-domain/ai-agent-client-api.riido.json"
      - "docs/20-domain/context-map.md"
      - "docs/20-domain/request-authorization.md"
      - "docs/30-architecture/api-client-delivery.md"
      - "docs/30-architecture/api-client-delivery.riido.json"
      - "docs/30-architecture/config-reference.md"
      - "docs/30-architecture/integration-matrix.md"
      - "docs/30-architecture/module-decomposition.md"
      - "docs/migration/control-plane.md"
      - "cmd/riido_ai_server/main.go"
      - "cmd/riido_ai_server/main_test.go"
      - "internal/riidoaiserver/ai_agent_client_*.go"
      - "internal/riidoaiserver/server.go"
      - "internal/riidoaiserver/authorization.go"
      - "tools/aiagentclientapi/**"
      - "tools/apiclientdelivery/**"
      - "tools/reactquerygen/**"
      - "tools/generatedclienthandoff/**"
      - "web/generated/aiAgentClient.ts"
      - "web/generated/aiAgentClient.react.ts"

jobs:
  ai-agent-client-api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false
      - name: Verify Go dependency allowlist
        run: go run ./tools/dependencyallowlist -contract dependency_allowlist.riido.json
      - name: Verify AI Agent client API executable SSOT
        run: |
          mkdir -p out
          go test ./tools/aiagentclientapi -count=1
          go run ./tools/aiagentclientapi \
            -check-doc \
            -evidence-out out/ai-agent-client-api-evidence.json
      - name: Verify API client delivery executable SSOT
        run: |
          go test ./tools/apiclientdelivery -count=1
          go run ./tools/apiclientdelivery \
            -check-doc \
            -evidence-out out/api-client-delivery-evidence.json
      - name: Test AI Agent development API
        run: go test ./internal/riidoaiserver -run 'AIAgentClient' -count=1
      - name: Test AI Agent runtime env
        run: go test ./cmd/riido_ai_server -run 'AIAgentClient|ConfigFromEnv' -count=1
      - name: Verify React Query generation drift
        run: go test ./tools/reactquerygen -count=1
      - name: Verify generated client handoff
        run: go test ./tools/generatedclienthandoff -count=1
      - name: Verify React Query generator command
        run: |
          tmpdir="$(mktemp -d)"
          tmp="$tmpdir/aiAgentClient.ts"
          go run ./tools/reactquerygen \
            -openapi contracts/ai-agent-client/control-plane-ai-agent-client.openapi.json \
            -out "$tmp"
          diff -u web/generated/aiAgentClient.ts "$tmp"
          diff -u web/generated/aiAgentClient.react.ts "$tmpdir/aiAgentClient.react.ts"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ai-agent-client-api-evidence
          path: |
            out/ai-agent-client-api-evidence.json
            out/api-client-delivery-evidence.json
          if-no-files-found: error

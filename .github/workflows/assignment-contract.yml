name: assignment-contract

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/assignment-contract.yml"
      - ".github/workflows/agent-runtime-binding.yml"
      - "docs/20-domain/saas-control-plane.md"
      - "docs/20-domain/agent-runtime-binding.md"
      - "docs/migration/control-plane.md"
      - "go.mod"
      - "go.sum"
      - "internal/riidoaiserver/doc.go"
      - "internal/riidoaiserver/assignment_contract_gen.go"
      - "internal/riidoaiserver/assignment_contract_test.go"
      - "internal/riidoaiserver/assignment_api.go"
      - "internal/riidoaiserver/assignment_api_test.go"
      - "internal/riidoaiserver/agent_registry.go"
      - "internal/riidoaiserver/agent_registry_test.go"
  pull_request:
    paths:
      - ".github/workflows/assignment-contract.yml"
      - ".github/workflows/agent-runtime-binding.yml"
      - "docs/20-domain/saas-control-plane.md"
      - "docs/20-domain/agent-runtime-binding.md"
      - "docs/migration/control-plane.md"
      - "go.mod"
      - "go.sum"
      - "internal/riidoaiserver/doc.go"
      - "internal/riidoaiserver/assignment_contract_gen.go"
      - "internal/riidoaiserver/assignment_contract_test.go"
      - "internal/riidoaiserver/assignment_api.go"
      - "internal/riidoaiserver/assignment_api_test.go"
      - "internal/riidoaiserver/agent_registry.go"
      - "internal/riidoaiserver/agent_registry_test.go"

jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false
      - name: Verify no non-Riido Go dependencies
        run: |
          allowed="github.com/teamswyg/riido-contracts"
          disallowed="$(go list -m all | awk -v allowed="$allowed" 'NR > 1 && $1 != allowed { print $1 }')"
          if [ -n "$disallowed" ]; then
            printf 'Disallowed Go dependencies:\n%s\n' "$disallowed"
            exit 1
          fi
      - name: Verify assignment contract import boundary
        run: |
          disallowed="$(go list -deps -f '{{if not .Standard}}{{.ImportPath}}{{end}}' ./internal/riidoaiserver | grep -E 'github.com/teamswyg/riido_daemon|github.com/teamswyg/riido-daemon|github.com/aws|internal/(dynamodb|terraform|infra)' || true)"
          if [ -n "$disallowed" ]; then
            printf 'Disallowed assignment contract imports:\n%s\n' "$disallowed"
            exit 1
          fi
      - name: Test assignment contract
        run: go test ./internal/riidoaiserver -run 'AssignmentContract|AssignmentAPI|StaticAgentRegistry|ValidateAssignmentBinding|ValidateDaemonBinding' -count=1

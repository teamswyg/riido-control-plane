name: assignment-contract

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/assignment-contract.yml"
      - ".github/workflows/agent-runtime-binding.yml"
      - "docs/20-domain/saas-control-plane.md"
      - "docs/20-domain/saas-control-plane.riido.json"
      - "docs/20-domain/agent-runtime-binding.md"
      - "docs/migration/control-plane.md"
      - "tools/saascontrolplane/**"
      - "go.mod"
      - "go.sum"
      - "internal/riidoaiserver/doc.go"
      - "internal/riidoaiserver/assignment_*"
      - "internal/riidoaiserver/agent_registry*"
      - "internal/contractscompat/**"
  pull_request:
    paths:
      - ".github/workflows/assignment-contract.yml"
      - ".github/workflows/agent-runtime-binding.yml"
      - "docs/20-domain/saas-control-plane.md"
      - "docs/20-domain/saas-control-plane.riido.json"
      - "docs/20-domain/agent-runtime-binding.md"
      - "docs/migration/control-plane.md"
      - "tools/saascontrolplane/**"
      - "go.mod"
      - "go.sum"
      - "internal/riidoaiserver/doc.go"
      - "internal/riidoaiserver/assignment_*"
      - "internal/riidoaiserver/agent_registry*"
      - "internal/contractscompat/**"

jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: false
      - name: Verify Go dependency allowlist
        run: go run ./tools/dependencyallowlist -contract dependency_allowlist.riido.json
      - name: Verify assignment contract import boundary
        run: |
          disallowed="$(go list -deps -f '{{if not .Standard}}{{.ImportPath}}{{end}}' ./internal/riidoaiserver | grep -E 'github.com/teamswyg/riido_daemon|github.com/teamswyg/riido-daemon|github.com/aws|internal/(dynamodb|terraform|infra)' || true)"
          if [ -n "$disallowed" ]; then
            printf 'Disallowed assignment contract imports:\n%s\n' "$disallowed"
            exit 1
          fi
      - name: Verify assignment contract executable SSOT
        run: |
          mkdir -p out
          go test ./tools/saascontrolplane -count=1
          go run ./tools/saascontrolplane \
            -boundary assignment-contract \
            -check-doc \
            -evidence-out out/assignment-contract-evidence.json
      - name: Test assignment contract
        run: |
          go test ./internal/contractscompat -count=1
          go test ./internal/riidoaiserver -run 'AssignmentContract|AssignmentAPI|StaticAgentRegistry|ValidateAssignmentBinding|ValidateDaemonBinding' -count=1
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: assignment-contract-evidence
          path: out/assignment-contract-evidence.json
          if-no-files-found: error

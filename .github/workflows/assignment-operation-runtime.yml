name: assignment-operation-runtime

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/assignment-operation-runtime.yml"
      - "docs/20-domain/assignment-operation-journal.md"
      - "docs/20-domain/saas-control-plane.md"
      - "docs/migration/control-plane.md"
      - "go.mod"
      - "go.sum"
      - "internal/riidoaiserver/assignment_api.go"
      - "internal/riidoaiserver/assignment_contract_gen.go"
      - "internal/riidoaiserver/assignment_operation_port.go"
      - "internal/riidoaiserver/assignment_operation_replay.go"
      - "internal/riidoaiserver/store.go"
      - "internal/riidoaiserver/store_operation_runtime_test.go"
      - "internal/riidoaiserver/store_port.go"
      - "internal/riidoaiserver/store_state.go"
  pull_request:
    paths:
      - ".github/workflows/assignment-operation-runtime.yml"
      - "docs/20-domain/assignment-operation-journal.md"
      - "docs/20-domain/saas-control-plane.md"
      - "docs/migration/control-plane.md"
      - "go.mod"
      - "go.sum"
      - "internal/riidoaiserver/assignment_api.go"
      - "internal/riidoaiserver/assignment_contract_gen.go"
      - "internal/riidoaiserver/assignment_operation_port.go"
      - "internal/riidoaiserver/assignment_operation_replay.go"
      - "internal/riidoaiserver/store.go"
      - "internal/riidoaiserver/store_operation_runtime_test.go"
      - "internal/riidoaiserver/store_port.go"
      - "internal/riidoaiserver/store_state.go"

jobs:
  runtime:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false
      - name: Verify no non-Riido Go dependencies
        run: |
          allowed="github.com/teamswyg/riido-contracts"
          disallowed="$(go list -m all | awk -v allowed="$allowed" 'NR > 1 && $1 != allowed { print $1 }')"
          if [ -n "$disallowed" ]; then
            printf 'Disallowed Go dependencies:\n%s\n' "$disallowed"
            exit 1
          fi
      - name: Verify operation runtime import boundary
        run: |
          disallowed="$(go list -deps -f '{{if not .Standard}}{{.ImportPath}}{{end}}' ./internal/riidoaiserver | grep -E 'github.com/teamswyg/riido_daemon|github.com/teamswyg/riido-daemon|github.com/aws|internal/(dynamodb|terraform|infra)' || true)"
          if [ -n "$disallowed" ]; then
            printf 'Disallowed operation runtime imports:\n%s\n' "$disallowed"
            exit 1
          fi
      - name: Test assignment operation runtime wiring
        run: go test ./internal/riidoaiserver -run 'AssignmentOperationRuntimeCaptures|PollAgentUsesAssignmentClaimer|OpenStoreWithConfigReplaysAssignmentOperations|HeartbeatAgentRefreshesDurableActiveLease|PollAgentFailsStaleActiveAssignment|PollAgentUsesDurableCancellingProjection' -count=1

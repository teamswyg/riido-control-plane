name: ai-agent-generated-endpoint-smoke-matrix

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/ai-agent-generated-endpoint-smoke-matrix.yml"
      - "contracts/ai-agent-client/control-plane-ai-agent-client.openapi.json"
      - "contracts/ai-agent-client/control-plane-ai-agent-client.smoke-matrix.riido.json"
      - "docs/30-architecture/ai-agent-generated-endpoint-smoke-matrix.md"
      - "docs/30-architecture/ai-agent-generated-endpoint-smoke-matrix.riido.json"
      - "docs/executable-knowledge.md"
      - "docs/executable-knowledge.riido.json"
      - "internal/riidoaiserver/ai_agent_client_generated_smoke_test.go"
      - "tools/aigeneratedsmokematrix/**"
  pull_request:
    paths:
      - ".github/workflows/ai-agent-generated-endpoint-smoke-matrix.yml"
      - "contracts/ai-agent-client/control-plane-ai-agent-client.openapi.json"
      - "contracts/ai-agent-client/control-plane-ai-agent-client.smoke-matrix.riido.json"
      - "docs/30-architecture/ai-agent-generated-endpoint-smoke-matrix.md"
      - "docs/30-architecture/ai-agent-generated-endpoint-smoke-matrix.riido.json"
      - "docs/executable-knowledge.md"
      - "docs/executable-knowledge.riido.json"
      - "internal/riidoaiserver/ai_agent_client_generated_smoke_test.go"
      - "tools/aigeneratedsmokematrix/**"

jobs:
  smoke-matrix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: false
      - name: Verify Go dependency allowlist
        run: go run ./tools/dependencyallowlist -contract dependency_allowlist.riido.json
      - name: Verify generated endpoint smoke matrix
        run: |
          mkdir -p out
          go test ./tools/aigeneratedsmokematrix -count=1
          go run ./tools/aigeneratedsmokematrix \
            -check-doc \
            -evidence-out out/ai-agent-generated-endpoint-smoke-matrix-evidence.json
      - name: Test generated endpoint smoke matrix
        run: go test ./internal/riidoaiserver -run 'GeneratedEndpointSmoke|SmokeMatrix' -count=1
      - name: Verify executable knowledge coverage
        run: |
          go run ./tools/knowledgecoverage \
            -check-doc \
            -evidence-out out/executable-knowledge-coverage.json
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: ai-agent-generated-endpoint-smoke-matrix-evidence
          path: |
            out/ai-agent-generated-endpoint-smoke-matrix-evidence.json
            out/executable-knowledge-coverage.json
          if-no-files-found: error

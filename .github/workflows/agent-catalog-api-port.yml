name: agent-catalog-api-port

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/agent-catalog-api-port.yml"
      - "docs/20-domain/agent-catalog-rbac.md"
      - "docs/migration/control-plane.md"
      - "go.mod"
      - "go.sum"
      - "internal/riidoaiserver/doc.go"
      - "internal/riidoaiserver/agent_catalog_api.go"
      - "internal/riidoaiserver/agent_catalog_api_test.go"
      - "internal/riidoaiserver/agent_catalog_port.go"
      - "internal/riidoaiserver/agent_catalog_rbac.go"
  pull_request:
    paths:
      - ".github/workflows/agent-catalog-api-port.yml"
      - "docs/20-domain/agent-catalog-rbac.md"
      - "docs/migration/control-plane.md"
      - "go.mod"
      - "go.sum"
      - "internal/riidoaiserver/doc.go"
      - "internal/riidoaiserver/agent_catalog_api.go"
      - "internal/riidoaiserver/agent_catalog_api_test.go"
      - "internal/riidoaiserver/agent_catalog_port.go"
      - "internal/riidoaiserver/agent_catalog_rbac.go"

jobs:
  port:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false
      - name: Verify Go dependency allowlist
        run: go run ./tools/dependencyallowlist -contract dependency_allowlist.riido.json
      - name: Verify catalog API import boundary
        run: |
          disallowed="$(go list -deps -f '{{if not .Standard}}{{.ImportPath}}{{end}}' ./internal/riidoaiserver | grep -E 'github.com/teamswyg/riido_daemon|github.com/teamswyg/riido-daemon|github.com/aws|internal/(dynamodb|terraform|infra)' || true)"
          if [ -n "$disallowed" ]; then
            printf 'Disallowed catalog API imports:\n%s\n' "$disallowed"
            exit 1
          fi
      - name: Test agent catalog API port
        run: go test ./internal/riidoaiserver -run 'AgentCatalogAPI|AgentCatalogStorePort' -count=1

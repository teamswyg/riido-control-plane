name: ai-agent-client-testnet-smoke

on:
  workflow_dispatch:
  schedule:
    - cron: "11 19 * * *"

concurrency:
  group: ai-agent-client-testnet-smoke
  cancel-in-progress: false

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      RIIDO_LOOP_IDS: provider_acceptance_harness ai_thread_history
      TESTNET_BASE_URL: ${{ vars.RIIDO_AI_SERVER_TESTNET_BASE_URL }}
      TESTNET_TOKEN: ${{ secrets.RIIDO_AI_SERVER_TESTNET_TOKEN }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: false

      - name: Verify testnet configuration
        run: |
          test -n "$TESTNET_BASE_URL" || {
            echo "RIIDO_AI_SERVER_TESTNET_BASE_URL repository variable is required"
            exit 1
          }
          test -n "$TESTNET_TOKEN" || {
            echo "RIIDO_AI_SERVER_TESTNET_TOKEN repository secret is required"
            exit 1
          }
          echo "::add-mask::$TESTNET_BASE_URL"
          echo "::add-mask::$TESTNET_TOKEN"
      - name: Smoke AI Agent client API
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          base_url="${TESTNET_BASE_URL%/}"
          auth_header="X-Riido-AI-Agent-Token: ${TESTNET_TOKEN}"
          workspace_id="workspace-smoke"
          smoke_suffix="${GITHUB_RUN_ID:-manual}-$(date +%s)"
          smoke_task_id="task-smoke-$smoke_suffix"
          smoke_task_id_v2="task-smoke-v2-$smoke_suffix"

          curl_json() {
            curl --fail --silent --show-error \
              --connect-timeout 5 \
              --max-time 15 \
              "$@"
          }

          curl_json "$base_url/healthz" \
            | jq -e '.schema_version == "riido-ai-server.v1" and .status == "ok"' >/dev/null
          curl_json "$base_url/readyz" \
            | jq -e '.schema_version == "riido-ai-server.v1" and .status == "ready"' >/dev/null
          curl_json \
            -H "$auth_header" \
            -H "Content-Type: application/json" \
            -d '{"content_type":"image/png","content_length_bytes":1024}' \
            "$base_url/v1/client/ai-agent/profile-thumbnails/uploads" \
            | jq -e '.schema_version == "riido-ai-server.v1" and .method == "POST" and .form_file_field == "file" and (.upload_url | length) > 0 and (.profile_thumbnail_url | startswith("https://")) and (.form_fields | length) >= 6 and .max_content_length_bytes >= 1024' >/dev/null
          curl_json -H "$auth_header" "$base_url/v1/client/ai-agent/bootstrap" \
            | jq -e '.schema_version == "riido-ai-server.v1" and (.agents | length) > 0 and (.devices | length) > 0' >/dev/null
          curl_json -H "$auth_header" "$base_url/v1/client/ai-agent/devices" \
            | jq -e '.schema_version == "riido-ai-server.v1" and (.devices | length) > 0' >/dev/null
          device_id="$(
            curl_json -H "$auth_header" "$base_url/v1/client/ai-agent/devices" \
              | jq -re '.devices[0].device_id'
          )"
          curl_json -H "$auth_header" "$base_url/v1/client/ai-agent/devices/$device_id/daemon" \
            | jq -e --arg device_id "$device_id" '.schema_version == "riido-ai-server.v1" and .daemon.device_id == $device_id and (.daemon.supported_actions | length) >= 1' >/dev/null
          curl_json -H "$auth_header" "$base_url/v1/client/ai-agent/agents/agent-owned-codex/daemon" \
            | jq -e '.schema_version == "riido-ai-server.v1" and .daemon.device_id == "device-dev-macbook" and (.daemon.supported_actions | length) > 0' >/dev/null
          curl_json -H "$auth_header" "$base_url/v1/client/ai-agent/agents/agent-public-openclaw/daemon" \
            | jq -e '.schema_version == "riido-ai-server.v1" and .daemon.device_id == "device-shared-studio" and (.daemon.supported_actions | length) > 0' >/dev/null
          curl_json -H "$auth_header" "$base_url/v1/client/ai-agent/tasks/task-1/assignable-agents" \
            | jq -e '.schema_version == "riido-ai-server.v1" and any(.agents[]; .agent_id == "agent-owned-codex")' >/dev/null
          curl_json -H "$auth_header" "$base_url/v1/client/ai-agent/tasks/task-1/assignable-agents" \
            | jq -e '.schema_version == "riido-ai-server.v1" and any(.agents[]; .agent_id == "agent-public-openclaw")' >/dev/null
          curl_json -H "$auth_header" "$base_url/v1/client/ai-agent/tasks/task-1/threads" \
            | jq -e '.schema_version == "riido-ai-server.v1" and (.threads | length) >= 1' >/dev/null
          created_v1_agent="$(
            curl_json \
              -H "$auth_header" \
              -H "Content-Type: application/json" \
              -d "{\"name\":\"Smoke 신규 에이전트 $smoke_suffix\",\"visibility\":\"private\",\"runtime_id\":\"runtime-cursor-dev\",\"description\":\"testnet smoke agent\",\"instruction\":\"smoke test instruction\"}" \
              "$base_url/v1/client/ai-agent/agents" \
              | jq -re 'if .schema_version == "riido-ai-server.v1" and .agent.is_owned_by_viewer == true and .agent.runtime_kind == "cursor" and .agent.editability == "editable" and .agent.assigned_task_count == 0 and (.agent.updated_at | length) > 0 then .agent.agent_id else empty end'
          )"
          curl_json \
            -H "$auth_header" \
            -H "Content-Type: application/json" \
            -d "{\"agent_id\":\"$created_v1_agent\"}" \
            "$base_url/v1/client/ai-agent/tasks/$smoke_task_id/assignment" \
            | jq -e --arg agent_id "$created_v1_agent" '.schema_version == "riido-ai-server.v1" and .agent_id == $agent_id and .assignment_state == "running"' >/dev/null
          curl_json \
            -H "$auth_header" \
            -H "Content-Type: application/json" \
            -d "{\"agent_id\":\"$created_v1_agent\",\"body\":\"Please continue from the latest design\"}" \
            "$base_url/v1/client/ai-agent/tasks/$smoke_task_id/comments" \
            | jq -e --arg agent_id "$created_v1_agent" '.schema_version == "riido-ai-server.v1" and .agent_id == $agent_id and (.assignment_state == "running" or .assignment_state == "queued")' >/dev/null
          curl_json \
            -H "$auth_header" \
            -H "Content-Type: application/json" \
            -d "{\"agent_id\":\"$created_v1_agent\",\"reason\":\"user requested stop\"}" \
            "$base_url/v1/client/ai-agent/tasks/$smoke_task_id/stop" \
            | jq -e '.schema_version == "riido-ai-server.v1" and .comment_kind == "stopped_by_user_request" and .assignment_state == "stopped"' >/dev/null

          replay="$(mktemp)"
          trap 'rm -f "$replay"' EXIT
          curl_json -H "$auth_header" "$base_url/v1/client/ai-agent/events?replay=1" > "$replay"
          grep -q "$created_v1_agent" "$replay"
          grep -q "stopped_by_user_request" "$replay"

          curl_json -H "$auth_header" "$base_url/v2/client/workspaces/$workspace_id/ai-agent/bootstrap" \
            | jq -e --arg workspace_id "$workspace_id" '.schema_version == "riido-ai-server.v1" and .workspace_id == $workspace_id and (.devices | length) > 0' >/dev/null
          curl_json \
            -H "$auth_header" \
            -H "Content-Type: application/json" \
            -d '{"content_type":"image/jpeg","content_length_bytes":2048}' \
            "$base_url/v2/client/workspaces/$workspace_id/ai-agent/profile-thumbnails/uploads" \
            | jq -e '.schema_version == "riido-ai-server.v1" and .method == "POST" and .form_file_field == "file" and (.upload_url | length) > 0 and (.profile_thumbnail_url | startswith("https://")) and (.form_fields | length) >= 6 and .max_content_length_bytes >= 2048' >/dev/null
          device_id_v2="$(
            curl_json -H "$auth_header" "$base_url/v2/client/workspaces/$workspace_id/ai-agent/devices" \
              | jq -re '.devices[0].device_id'
          )"
          curl_json -H "$auth_header" "$base_url/v2/client/workspaces/$workspace_id/ai-agent/devices/$device_id_v2/daemon" \
            | jq -e --arg device_id "$device_id_v2" '.schema_version == "riido-ai-server.v1" and .daemon.device_id == $device_id and (.daemon.supported_actions | length) >= 1' >/dev/null
          created_v2_agent="$(
            curl_json \
              -H "$auth_header" \
              -H "Content-Type: application/json" \
              -d '{"name":"Smoke v2 에이전트","visibility":"private","runtime_id":"runtime-cursor-dev","description":"workspace scoped smoke agent","instruction":"smoke test instruction"}' \
              "$base_url/v2/client/workspaces/$workspace_id/ai-agent/agents" \
              | jq -re --arg workspace_id "$workspace_id" 'if .schema_version == "riido-ai-server.v1" and .agent.workspace_id == $workspace_id and .agent.is_owned_by_viewer == true and .agent.runtime_kind == "cursor" then .agent.agent_id else empty end' \
          )"
          v2_assignment="$(mktemp)"
          curl_json \
            -H "$auth_header" \
            -H "Content-Type: application/json" \
            -d "{\"agent_id\":\"$created_v2_agent\"}" \
            "$base_url/v2/client/workspaces/$workspace_id/ai-agent/tasks/$smoke_task_id_v2/assignment" \
            > "$v2_assignment"
          jq -e --arg agent_id "$created_v2_agent" '.schema_version == "riido-ai-server.v1" and .agent_id == $agent_id and .assignment_state == "running"' "$v2_assignment" >/dev/null
          thread_id_v2="$(jq -re '.thread_id' "$v2_assignment")"
          rm -f "$v2_assignment"
          v3_followup_body="Please preserve this v3 follow-up after refresh"
          curl_json \
            -H "$auth_header" \
            -H "Content-Type: application/json" \
            -d "{\"body\":\"$v3_followup_body\",\"source_message_id\":\"message-smoke-v3-$smoke_suffix\"}" \
            "$base_url/v2/client/workspaces/$workspace_id/ai-agent/tasks/$smoke_task_id_v2/threads/$thread_id_v2/messages" \
            | jq -e --arg thread_id "$thread_id_v2" '.schema_version == "riido-ai-server.v1" and .thread_id == $thread_id' >/dev/null
          curl_json -H "$auth_header" "$base_url/v2/client/workspaces/$workspace_id/ai-agent/tasks/$smoke_task_id_v2/threads" \
            | jq -e --arg agent_id "$created_v2_agent" --arg href "/v2/client/workspaces/$workspace_id/ai-agent/events" '.schema_version == "riido-ai-server.v1" and any(.threads[]; .agent_id == $agent_id) and .active_stream.href == $href' >/dev/null
          curl_json -H "$auth_header" "$base_url/v3/client/workspaces/$workspace_id/ai-agent/tasks/$smoke_task_id_v2/threads" \
            | jq -e --arg task_id "$smoke_task_id_v2" --arg agent_id "$created_v2_agent" --arg href "/v2/client/workspaces/$workspace_id/ai-agent/events" --arg thread_id "$thread_id_v2" --arg body "$v3_followup_body" '
              . as $root
              | .schema_version == "riido-ai-server.v1"
              and .task_id == $task_id
              and .active_stream.href == $href
              and (.agent_snapshots | type) == "object"
              and any(.threads[];
                .thread_id == $thread_id
                and .agent_id == $agent_id
                and ((.agent_snapshot_id // "") | length) > 0
                and ($root.agent_snapshots[.agent_snapshot_id].agent_id == $agent_id)
                and ((.messages | type) == "array")
                and any(.messages[]; .role == "user" and .body == $body)
              )
            ' >/dev/null

      - name: Publish redacted smoke summary evidence
        if: always()
        env:
          RIIDO_LIVE_CHECK_STATUS: ${{ job.status }}
        run: |
          mkdir -p out
          go run ./tools/liveworkflowevidence \
            -workflow ai-agent-client-testnet-smoke \
            -live-status "$RIIDO_LIVE_CHECK_STATUS" \
            -evidence-out out/ai-agent-client-testnet-smoke-redacted-summary.json

      - name: Promote harness failures to closed-loop candidates
        if: always()
        run: |
          mkdir -p out
          go run ./tools/harnesspromotion \
            -summary out/ai-agent-client-testnet-smoke-redacted-summary.json \
            -candidate-out out/ai-agent-client-testnet-smoke-closed-loop-candidates.json

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: ai-agent-client-testnet-smoke-redacted-summary
          path: out/ai-agent-client-testnet-smoke-redacted-summary.json
          if-no-files-found: error

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: ai-agent-client-testnet-smoke-closed-loop-candidates
          path: out/ai-agent-client-testnet-smoke-closed-loop-candidates.json
          if-no-files-found: error

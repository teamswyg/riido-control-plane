name: ai-agent-client-testnet-smoke

on:
  workflow_dispatch:

concurrency:
  group: ai-agent-client-testnet-smoke
  cancel-in-progress: false

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      TESTNET_BASE_URL: ${{ vars.RIIDO_AI_SERVER_TESTNET_BASE_URL }}
      TESTNET_TOKEN: ${{ secrets.RIIDO_AI_SERVER_TESTNET_TOKEN }}
    steps:
      - name: Verify testnet configuration
        run: |
          test -n "$TESTNET_BASE_URL" || {
            echo "RIIDO_AI_SERVER_TESTNET_BASE_URL repository variable is required"
            exit 1
          }
          test -n "$TESTNET_TOKEN" || {
            echo "RIIDO_AI_SERVER_TESTNET_TOKEN repository secret is required"
            exit 1
          }
          echo "::add-mask::$TESTNET_BASE_URL"
          echo "::add-mask::$TESTNET_TOKEN"
      - name: Smoke AI Agent client API
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          base_url="${TESTNET_BASE_URL%/}"
          auth_header="X-Riido-AI-Agent-Token: ${TESTNET_TOKEN}"
          workspace_id="workspace-smoke"

          curl_json() {
            curl --fail --silent --show-error \
              --connect-timeout 5 \
              --max-time 15 \
              "$@"
          }

          curl_json "$base_url/healthz" \
            | jq -e '.schema_version == "riido-ai-server.v1" and .status == "ok"' >/dev/null
                    curl_json "$base_url/readyz" \
                      | jq -e '.schema_version == "riido-ai-server.v1" and .status == "ready"' >/dev/null
                    curl_json -H "$auth_header" "$base_url/v1/client/ai-agent/bootstrap" \
                      | jq -e '.schema_version == "riido-ai-server.v1" and (.agents | type) == "array" and (.devices | type) == "array"' >/dev/null
                    curl_json -H "$auth_header" "$base_url/v1/client/ai-agent/devices" \
                      | jq -e '.schema_version == "riido-ai-server.v1" and (.devices | type) == "array"' >/dev/null
                    curl_json -H "$auth_header" "$base_url/v1/client/ai-agent/onboarding/fixtures" \
                      | jq -e '.schema_version == "riido-ai-server.v1" and (.fixtures | length) > 0' >/dev/null

                    curl_json -H "$auth_header" "$base_url/v2/client/workspaces/$workspace_id/ai-agent/bootstrap" \
                      | jq -e --arg workspace_id "$workspace_id" '.schema_version == "riido-ai-server.v1" and .workspace_id == $workspace_id and (.agents | type) == "array" and (.devices | type) == "array"' >/dev/null
                    curl_json -H "$auth_header" "$base_url/v2/client/workspaces/$workspace_id/ai-agent/onboarding/fixtures" \
                      | jq -e '.schema_version == "riido-ai-server.v1" and (.fixtures | length) > 0' >/dev/null

                    devices="$(mktemp)"
                    trap 'rm -f "$devices"' EXIT
                    curl_json -H "$auth_header" "$base_url/v2/client/workspaces/$workspace_id/ai-agent/devices" > "$devices"
                    runtime_id="$(jq -r '[.devices[].runtimes[]?.runtime_id | select(. != null and . != "")][0] // ""' "$devices")"
                    if [ -n "$runtime_id" ]; then
                      created_v2_agent="$(
                        curl_json \
                          -H "$auth_header" \
                          -H "Content-Type: application/json" \
                          -d "{\"name\":\"Smoke v2 에이전트\",\"visibility\":\"private\",\"runtime_id\":\"$runtime_id\",\"description\":\"workspace scoped smoke agent\",\"instruction\":\"smoke test instruction\"}" \
                          "$base_url/v2/client/workspaces/$workspace_id/ai-agent/agents" \
                          | jq -re --arg workspace_id "$workspace_id" 'if .schema_version == "riido-ai-server.v1" and .agent.workspace_id == $workspace_id and .agent.is_owned_by_viewer == true then .agent.agent_id else empty end' \
                      )"
                      curl_json \
                        -H "$auth_header" \
                        -H "Content-Type: application/json" \
                        -d "{\"agent_id\":\"$created_v2_agent\"}" \
                        "$base_url/v2/client/workspaces/$workspace_id/ai-agent/tasks/task-smoke-v2/assignment" \
                        | jq -e --arg agent_id "$created_v2_agent" '.schema_version == "riido-ai-server.v1" and .agent_id == $agent_id and (.assignment_state == "running" or .assignment_state == "queued")' >/dev/null
                      curl_json -H "$auth_header" "$base_url/v2/client/workspaces/$workspace_id/ai-agent/tasks/task-smoke-v2/threads" \
                        | jq -e --arg agent_id "$created_v2_agent" --arg href "/v2/client/workspaces/$workspace_id/ai-agent/events" '.schema_version == "riido-ai-server.v1" and any(.threads[]; .agent_id == $agent_id) and (.active_stream == null or .active_stream.href == $href)' >/dev/null
                    else
                      echo "No registered runtime found; read-surface smoke completed without mutation smoke."
                    fi

name: closed-loop-candidate-decision

on:
  workflow_dispatch:
  schedule:
    - cron: "47 2 * * *"
  push:
    branches: [main]
    paths:
      - ".github/workflows/closed-loop-candidate-decision.yml"
      - ".github/workflows/ai-agent-client-testnet-smoke.yml"
      - ".github/workflows/ai-agent-client-testnet-load.yml"
      - ".github/workflows/control-plane-performance.yml"
      - ".github/workflows/loop-closure-audit.yml"
      - ".github/workflows/loop-refresh-dispatch.yml"
      - "docs/30-architecture/control-plane-performance.riido.json"
      - "docs/30-architecture/control-plane-performance.md"
      - "docs/30-architecture/harness-promotion.riido.json"
      - "docs/30-architecture/loop-closure-audit.riido.json"
      - "docs/30-architecture/loop-refresh-dispatch.riido.json"
      - "docs/30-architecture/closed-loop-candidate-intake.riido.json"
      - "docs/30-architecture/loop-registry.riido.json"
      - "docs/30-architecture/closed-loop-candidate-decision.riido.json"
      - "docs/30-architecture/closed-loop-candidate-decision.md"
      - "docs/30-architecture/fixtures/harness-failure-summary.fixture.json"
      - "docs/30-architecture/fixtures/performance-failure-summary.fixture.json"
      - "tools/closedloopcandidatedecision/**"
      - "tools/closedloopcandidateintake/**"
      - "tools/controlplanepressure/**"
      - "tools/harnesspromotion/**"
      - "tools/loopclosureaudit/**"
      - "tools/looprefreshdispatch/**"
  pull_request:
    paths:
      - ".github/workflows/closed-loop-candidate-decision.yml"
      - ".github/workflows/ai-agent-client-testnet-smoke.yml"
      - ".github/workflows/ai-agent-client-testnet-load.yml"
      - ".github/workflows/control-plane-performance.yml"
      - ".github/workflows/loop-closure-audit.yml"
      - ".github/workflows/loop-refresh-dispatch.yml"
      - "docs/30-architecture/control-plane-performance.riido.json"
      - "docs/30-architecture/control-plane-performance.md"
      - "docs/30-architecture/harness-promotion.riido.json"
      - "docs/30-architecture/loop-closure-audit.riido.json"
      - "docs/30-architecture/loop-refresh-dispatch.riido.json"
      - "docs/30-architecture/closed-loop-candidate-intake.riido.json"
      - "docs/30-architecture/loop-registry.riido.json"
      - "docs/30-architecture/closed-loop-candidate-decision.riido.json"
      - "docs/30-architecture/closed-loop-candidate-decision.md"
      - "docs/30-architecture/fixtures/harness-failure-summary.fixture.json"
      - "docs/30-architecture/fixtures/performance-failure-summary.fixture.json"
      - "tools/closedloopcandidatedecision/**"
      - "tools/closedloopcandidateintake/**"
      - "tools/controlplanepressure/**"
      - "tools/harnesspromotion/**"
      - "tools/loopclosureaudit/**"
      - "tools/looprefreshdispatch/**"

permissions:
  contents: read
  actions: read

jobs:
  closed-loop-candidate-decision:
    runs-on: ubuntu-latest
    env:
      RIIDO_LOOP_IDS: closed_loop_candidate_decision closed_loop_candidate
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: false
      - name: Verify closed-loop candidate decision
        run: |
          mkdir -p out
          go test ./tools/closedloopcandidatedecision -count=1
          RIIDO_HARNESS_PROMOTION_NOW=2026-06-24T12:00:00Z \
            go run ./tools/harnesspromotion \
            -summary docs/30-architecture/fixtures/harness-failure-summary.fixture.json \
            -candidate-out out/sample-closed-loop-candidates.json
          RIIDO_EVIDENCE_NOW=2026-06-24T12:00:00Z \
            go run ./tools/closedloopcandidateintake \
            -candidate-in out/sample-closed-loop-candidates.json \
            -evidence-out out/sample-candidate-intake-evidence.json
          RIIDO_EVIDENCE_NOW=2026-06-24T12:00:00Z \
            go run ./tools/closedloopcandidatedecision \
            -check-doc \
            -candidate-in out/sample-closed-loop-candidates.json \
            -evidence-out out/closed-loop-candidate-decision-evidence.json \
            -commands-out out/closed-loop-candidate-decision-commands.json
          RIIDO_HARNESS_PROMOTION_NOW=2026-06-24T12:00:00Z \
            go run ./tools/harnesspromotion \
            -summary docs/30-architecture/fixtures/performance-failure-summary.fixture.json \
            -candidate-out out/sample-performance-closed-loop-candidates.json
          RIIDO_EVIDENCE_NOW=2026-06-24T12:00:00Z \
            go run ./tools/closedloopcandidatedecision \
            -candidate-in out/sample-performance-closed-loop-candidates.json \
            -evidence-out out/sample-performance-decision-evidence.json
          go run ./tools/controlplanepressure \
            -duration 20ms \
            -concurrency 1 \
            -threads 2 \
            -lines 1 \
            -candidate-out out/sample-pressure-closed-loop-candidates.json \
            -evidence-out out/sample-pressure-local-pressure.json
          RIIDO_EVIDENCE_NOW=2026-06-24T12:00:00Z \
            go run ./tools/closedloopcandidatedecision \
            -candidate-in out/sample-pressure-closed-loop-candidates.json \
            -evidence-out out/sample-pressure-decision-evidence.json
          RIIDO_LOOP_CLOSURE_AUDIT_NOW=2026-06-24T12:00:00Z \
            go run ./tools/loopclosureaudit \
            -candidate-out out/sample-loop-closure-audit-candidates.json
          if jq -e '(.candidate_count // 0) > 0' out/sample-loop-closure-audit-candidates.json >/dev/null; then
            RIIDO_EVIDENCE_NOW=2026-06-24T12:00:00Z \
              go run ./tools/closedloopcandidatedecision \
              -candidate-in out/sample-loop-closure-audit-candidates.json \
              -evidence-out out/sample-loop-closure-audit-decision-evidence.json
          else
            printf '{"schema_version":"riido-control-plane-closed-loop-candidate-decision-sample.v1","status":"skipped","reason":"sample candidate artifact contained no open candidates"}\n' \
              > out/sample-loop-closure-audit-decision-evidence.json
          fi
          cat > out/sample-loop-refresh-commands.json <<'JSON'
          {
            "schema_version": "riido-control-plane-loop-refresh-commands.v1",
            "status": "refresh_required",
            "generated_at": "2026-06-24T00:00:00Z",
            "expires_at": "2026-06-25T00:00:00Z",
            "command_count": 1,
            "commands": [
              {
                "loop_id": "control_plane_pressure_candidate",
                "kind": "target_verifier",
                "command": "go test ./tools/controlplaneperf"
              }
            ]
          }
          JSON
          RIIDO_EVIDENCE_NOW=2026-06-24T12:00:00Z \
            go run ./tools/looprefreshdispatch \
            -commands-in out/sample-loop-refresh-commands.json \
            -evidence-out out/sample-loop-refresh-dispatch-plan.json \
            -candidate-out out/sample-loop-refresh-dispatch-candidates.json
          RIIDO_EVIDENCE_NOW=2026-06-24T12:00:00Z \
            go run ./tools/closedloopcandidatedecision \
            -candidate-in out/sample-loop-refresh-dispatch-candidates.json \
            -evidence-out out/sample-loop-refresh-dispatch-decision-evidence.json
      - name: Download latest live candidate artifacts
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p out/live-candidates
          : > out/live-candidate-files.txt
          download_candidate_artifact() {
            local workflow="$1"
            local artifact="$2"
            local dest="$3"
            local run_id
            run_id="$(gh run list \
              --workflow "$workflow" \
              --branch main \
              --limit 20 \
              --json databaseId,status \
              --jq '[.[] | select(.status == "completed")][0].databaseId // ""')"
            test -n "$run_id"
            mkdir -p "$dest"
            gh run download "$run_id" --name "$artifact" --dir "$dest"
            find "$dest" -type f -name '*.json' -print >> out/live-candidate-files.txt
          }
          download_candidate_artifact \
            ai-agent-client-testnet-smoke.yml \
            ai-agent-client-testnet-smoke-closed-loop-candidates \
            out/live-candidates/smoke
          download_candidate_artifact \
            ai-agent-client-testnet-load.yml \
            ai-agent-client-testnet-load-closed-loop-candidates \
            out/live-candidates/load
          download_candidate_artifact \
            control-plane-performance.yml \
            control-plane-performance-closed-loop-candidates \
            out/live-candidates/performance
          download_candidate_artifact \
            control-plane-performance.yml \
            control-plane-pressure-closed-loop-candidates \
            out/live-candidates/pressure
          download_candidate_artifact \
            loop-closure-audit.yml \
            loop-closure-audit-closed-loop-candidates \
            out/live-candidates/loop-closure-audit
          download_candidate_artifact \
            loop-refresh-dispatch.yml \
            loop-refresh-dispatch-closed-loop-candidates \
            out/live-candidates/loop-refresh-dispatch
          test -s out/live-candidate-files.txt
      - name: Verify live candidate decisions
        if: github.event_name != 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          smoke_candidate="$(find out/live-candidates/smoke -type f -name '*.json' | head -n 1)"
          load_candidate="$(find out/live-candidates/load -type f -name '*.json' | head -n 1)"
          performance_candidate="$(find out/live-candidates/performance -type f -name '*.json' | head -n 1)"
          pressure_candidate="$(find out/live-candidates/pressure -type f -name '*.json' | head -n 1)"
          loop_closure_candidate="$(find out/live-candidates/loop-closure-audit -type f -name '*.json' | head -n 1)"
          loop_refresh_candidate="$(find out/live-candidates/loop-refresh-dispatch -type f -name '*.json' | head -n 1)"
          test -n "$smoke_candidate"
          test -n "$load_candidate"
          test -n "$performance_candidate"
          test -n "$pressure_candidate"
          test -n "$loop_closure_candidate"
          test -n "$loop_refresh_candidate"
          if jq -e '(.candidate_count // 0) > 0' "$smoke_candidate" >/dev/null; then
            go run ./tools/closedloopcandidatedecision \
              -candidate-in "$smoke_candidate" \
              -evidence-out out/live-decision-smoke-evidence.json
          else
            printf '{"schema_version":"riido-control-plane-closed-loop-candidate-decision-live.v1","status":"skipped","reason":"live candidate artifact contained no open candidates"}\n' \
              > out/live-decision-smoke-evidence.json
          fi
          if jq -e '(.candidate_count // 0) > 0' "$load_candidate" >/dev/null; then
            go run ./tools/closedloopcandidatedecision \
              -candidate-in "$load_candidate" \
              -evidence-out out/live-decision-load-evidence.json
          else
            printf '{"schema_version":"riido-control-plane-closed-loop-candidate-decision-live.v1","status":"skipped","reason":"live candidate artifact contained no open candidates"}\n' \
              > out/live-decision-load-evidence.json
          fi
          if jq -e '(.candidate_count // 0) > 0' "$performance_candidate" >/dev/null; then
            go run ./tools/closedloopcandidatedecision \
              -candidate-in "$performance_candidate" \
              -evidence-out out/live-decision-performance-evidence.json
          else
            printf '{"schema_version":"riido-control-plane-closed-loop-candidate-decision-live.v1","status":"skipped","reason":"live candidate artifact contained no open candidates"}\n' \
              > out/live-decision-performance-evidence.json
          fi
          if jq -e '(.candidate_count // 0) > 0' "$pressure_candidate" >/dev/null; then
            go run ./tools/closedloopcandidatedecision \
              -candidate-in "$pressure_candidate" \
              -evidence-out out/live-decision-pressure-evidence.json
          else
            printf '{"schema_version":"riido-control-plane-closed-loop-candidate-decision-live.v1","status":"skipped","reason":"live candidate artifact contained no open candidates"}\n' \
              > out/live-decision-pressure-evidence.json
          fi
          if jq -e '(.candidate_count // 0) > 0' "$loop_closure_candidate" >/dev/null; then
            go run ./tools/closedloopcandidatedecision \
              -candidate-in "$loop_closure_candidate" \
              -evidence-out out/live-decision-loop-closure-audit-evidence.json
          else
            printf '{"schema_version":"riido-control-plane-closed-loop-candidate-decision-live.v1","status":"skipped","reason":"live candidate artifact contained no open candidates"}\n' \
              > out/live-decision-loop-closure-audit-evidence.json
          fi
          if jq -e '(.candidate_count // 0) > 0' "$loop_refresh_candidate" >/dev/null; then
            go run ./tools/closedloopcandidatedecision \
              -candidate-in "$loop_refresh_candidate" \
              -evidence-out out/live-decision-loop-refresh-dispatch-evidence.json
          else
            printf '{"schema_version":"riido-control-plane-closed-loop-candidate-decision-live.v1","status":"skipped","reason":"live candidate artifact contained no open candidates"}\n' \
              > out/live-decision-loop-refresh-dispatch-evidence.json
          fi
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: closed-loop-candidate-decision-evidence
          path: out/closed-loop-candidate-decision-evidence.json
          if-no-files-found: error
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: closed-loop-candidate-decision-commands
          path: out/closed-loop-candidate-decision-commands.json
          if-no-files-found: error
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: closed-loop-candidate-decision-loop-closure-sample-evidence
          path: out/sample-loop-closure-audit-decision-evidence.json
          if-no-files-found: error
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: closed-loop-candidate-decision-loop-refresh-sample-evidence
          path: |
            out/sample-loop-refresh-dispatch-plan.json
            out/sample-loop-refresh-dispatch-candidates.json
            out/sample-loop-refresh-dispatch-decision-evidence.json
          if-no-files-found: error
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: closed-loop-candidate-decision-performance-sample-evidence
          path: out/sample-performance-decision-evidence.json
          if-no-files-found: error
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: closed-loop-candidate-decision-pressure-sample-evidence
          path: |
            out/sample-pressure-local-pressure.json
            out/sample-pressure-decision-evidence.json
          if-no-files-found: error
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: closed-loop-candidate-decision-intake-evidence
          path: out/sample-candidate-intake-evidence.json
          if-no-files-found: error
      - uses: actions/upload-artifact@v7
        if: always() && github.event_name != 'pull_request'
        with:
          name: closed-loop-candidate-decision-live-evidence
          path: |
            out/live-decision-smoke-evidence.json
            out/live-decision-load-evidence.json
            out/live-decision-performance-evidence.json
            out/live-decision-pressure-evidence.json
            out/live-decision-loop-closure-audit-evidence.json
            out/live-decision-loop-refresh-dispatch-evidence.json
          if-no-files-found: error

name: integration-matrix

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/integration-matrix.yml"
      - ".github/workflows/*.yml"
      - "docs/30-architecture/integration-matrix.md"
      - "docs/30-architecture/integration-matrix.riido.json"
      - "docs/executable-knowledge.md"
      - "docs/executable-knowledge.riido.json"
      - "tools/integrationmatrix/**"
  pull_request:
    paths:
      - ".github/workflows/integration-matrix.yml"
      - ".github/workflows/*.yml"
      - "docs/30-architecture/integration-matrix.md"
      - "docs/30-architecture/integration-matrix.riido.json"
      - "docs/executable-knowledge.md"
      - "docs/executable-knowledge.riido.json"
      - "tools/integrationmatrix/**"

jobs:
  integration-matrix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: false
      - name: Verify Go dependency allowlist
        run: go run ./tools/dependencyallowlist -contract dependency_allowlist.riido.json
      - name: Verify integration matrix
        run: |
          mkdir -p out
          go test ./tools/integrationmatrix -count=1
          go run ./tools/integrationmatrix \
            -check-doc \
            -evidence-out out/integration-matrix-evidence.json
      - name: Verify executable knowledge coverage
        run: |
          go run ./tools/knowledgecoverage \
            -check-doc \
            -evidence-out out/executable-knowledge-coverage.json
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: integration-matrix-evidence
          path: |
            out/integration-matrix-evidence.json
            out/executable-knowledge-coverage.json
          if-no-files-found: error

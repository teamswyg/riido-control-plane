name: agent-catalog-rbac

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/agent-catalog-rbac.yml"
      - "docs/20-domain/agent-catalog-rbac.md"
      - "docs/20-domain/agent-catalog-rbac.riido.json"
      - "docs/migration/control-plane.md"
      - "tools/agentcatalogrbac/**"
      - "go.mod"
      - "go.sum"
      - "internal/riidoaiserver/doc.go"
      - "internal/riidoaiserver/agent_catalog_rbac.go"
      - "internal/riidoaiserver/agent_catalog_rbac_test.go"
      - "internal/riidoaiserver/authorization.go"
      - "internal/riidoaiserver/authorization_test.go"
  pull_request:
    paths:
      - ".github/workflows/agent-catalog-rbac.yml"
      - "docs/20-domain/agent-catalog-rbac.md"
      - "docs/20-domain/agent-catalog-rbac.riido.json"
      - "docs/migration/control-plane.md"
      - "tools/agentcatalogrbac/**"
      - "go.mod"
      - "go.sum"
      - "internal/riidoaiserver/doc.go"
      - "internal/riidoaiserver/agent_catalog_rbac.go"
      - "internal/riidoaiserver/agent_catalog_rbac_test.go"
      - "internal/riidoaiserver/authorization.go"
      - "internal/riidoaiserver/authorization_test.go"

jobs:
  domain:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: false
      - name: Verify Go dependency allowlist
        run: go run ./tools/dependencyallowlist -contract dependency_allowlist.riido.json
      - name: Verify RBAC slice import boundary
        run: |
          disallowed="$(go list -deps -f '{{if not .Standard}}{{.ImportPath}}{{end}}' ./internal/riidoaiserver | grep -E 'github.com/teamswyg/riido_daemon|github.com/teamswyg/riido-daemon|github.com/aws|internal/(dynamodb|terraform|infra)' || true)"
          if [ -n "$disallowed" ]; then
            printf 'Disallowed RBAC imports:\n%s\n' "$disallowed"
            exit 1
          fi
      - name: Verify RBAC executable SSOT
        run: |
          mkdir -p out
          go test ./tools/agentcatalogrbac -count=1
          go run ./tools/agentcatalogrbac \
            -check-doc \
            -evidence-out out/agent-catalog-rbac-evidence.json
      - name: Test RBAC domain
        run: go test ./internal/riidoaiserver -run 'AgentCatalogRBAC|StaticTokenAuthorizer' -count=1
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: agent-catalog-rbac-evidence
          path: out/agent-catalog-rbac-evidence.json
          if-no-files-found: error

name: loop-refresh-dispatch

on:
  workflow_dispatch:
  schedule:
    - cron: "43 20 * * *"
  pull_request:
    paths:
      - ".github/workflows/loop-refresh-dispatch.yml"
      - ".github/workflows/closed-loop-candidate-decision.yml"
      - "tools/looprefreshdispatch/**"
      - "docs/30-architecture/loop-registry.md"
      - "docs/30-architecture/loop-registry.riido.json"
      - "docs/30-architecture/evidence-graph.md"
      - "docs/30-architecture/evidence-graph.riido.json"
      - "docs/30-architecture/closed-loop-candidate-decision.riido.json"
      - "docs/30-architecture/closed-loop-candidate-intake.riido.json"
      - "docs/30-architecture/loop-refresh-dispatch.riido.json"
      - "docs/30-architecture/module-decomposition.md"
      - "docs/30-architecture/module-decomposition.riido.json"

permissions:
  contents: read
  actions: write

jobs:
  dispatch:
    runs-on: ubuntu-latest
    env:
      RIIDO_LOOP_IDS: closed_loop_candidate
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: false
      - name: Verify dispatcher and sample evidence
        run: |
          mkdir -p out
          go test ./tools/looprefreshdispatch -count=1
          cat > out/sample-loop-refresh-commands.json <<'JSON'
          {
            "schema_version": "riido-control-plane-loop-refresh-commands.v1",
            "status": "refresh_required",
            "generated_at": "2026-06-25T00:00:00Z",
            "expires_at": "2026-06-26T00:00:00Z",
            "command_count": 3,
            "commands": [
              {
                "loop_id": "closed_loop_candidate",
                "kind": "refresh_workflow",
                "command": "gh workflow run loop-registry.yml --ref main"
              },
              {
                "loop_id": "open_decision_queue",
                "kind": "refresh_workflow",
                "command": "gh workflow run open-questions.yml --ref main"
              },
              {
                "loop_id": "control_plane_pressure_candidate",
                "kind": "target_verifier",
                "command": "go test ./tools/controlplaneperf"
              }
            ]
          }
          JSON
          cat > out/sample-decision-refresh-commands.json <<'JSON'
          {
            "schema_version": "riido-control-plane-loop-refresh-commands.v1",
            "status": "refresh_required",
            "generated_at": "2026-06-25T00:00:00Z",
            "expires_at": "2026-06-26T00:00:00Z",
            "command_count": 1,
            "commands": [
              {
                "loop_id": "closed_loop_candidate_decision",
                "kind": "target_verifier",
                "command": "go run ./tools/loopregistry -check-doc -github-annotations"
              }
            ]
          }
          JSON
          RIIDO_EVIDENCE_NOW=2026-06-25T00:00:00Z \
            go run ./tools/looprefreshdispatch \
            -commands-in out/sample-loop-refresh-commands.json \
            -commands-in out/sample-decision-refresh-commands.json \
            -evidence-out out/loop-refresh-dispatch-plan.json \
            -candidate-out out/loop-refresh-dispatch-closed-loop-candidates.json
      - name: Download live loop refresh commands
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p out/live-loop-refresh
          download_commands() {
            local workflow="$1"
            local artifact="$2"
            local dest="$3"
            local run_id
            run_id="$(gh run list --workflow "$workflow" --branch main --status success --limit 1 --json databaseId --jq '.[0].databaseId // ""')"
            test -n "$run_id"
            mkdir -p "$dest"
            gh run download "$run_id" --name "$artifact" --dir "$dest"
          }
          download_commands loop-registry.yml loop-refresh-commands out/live-loop-refresh/registry
          download_commands closed-loop-candidate-decision.yml closed-loop-candidate-decision-commands out/live-loop-refresh/decision
          live_commands="$(find out/live-loop-refresh/registry -type f -name 'loop-refresh-commands.json' | head -n 1)"
          decision_commands="$(find out/live-loop-refresh/decision -type f -name 'closed-loop-candidate-decision-commands.json' | head -n 1)"
          test -n "$live_commands"
          test -n "$decision_commands"
          go run ./tools/looprefreshdispatch \
            -commands-in "$live_commands" \
            -commands-in "$decision_commands" \
            -evidence-out out/loop-refresh-dispatch-plan.json \
            -candidate-out out/loop-refresh-dispatch-closed-loop-candidates.json
      - name: Dispatch expired refresh workflows
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          count="$(jq -r '.dispatch_count' out/loop-refresh-dispatch-plan.json)"
          if [ "$count" = "0" ]; then
            exit 0
          fi
          jq -r '.dispatches[].workflow_file' out/loop-refresh-dispatch-plan.json |
            while IFS= read -r workflow; do
              gh workflow run "$workflow" --ref main
            done
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: loop-refresh-dispatch-plan
          path: out/loop-refresh-dispatch-plan.json
          if-no-files-found: error
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: loop-refresh-dispatch-closed-loop-candidates
          path: out/loop-refresh-dispatch-closed-loop-candidates.json
          if-no-files-found: error

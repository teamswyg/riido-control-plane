name: loop-refresh-dispatch

on:
  workflow_dispatch:
  schedule:
    - cron: "43 20 * * *"
  pull_request:
    paths:
      - ".github/workflows/loop-refresh-dispatch.yml"
      - ".github/workflows/closed-loop-candidate-decision.yml"
      - "tools/looprefreshdispatch/**"
      - "tools/closedloopcandidatedecision/**"
      - "tools/harnesspromotion/**"
      - "docs/30-architecture/loop-registry.md"
      - "docs/30-architecture/loop-registry.riido.json"
      - "docs/30-architecture/evidence-graph.md"
      - "docs/30-architecture/evidence-graph.riido.json"
      - "docs/30-architecture/closed-loop-candidate-decision.riido.json"
      - "docs/30-architecture/closed-loop-candidate-decision.md"
      - "docs/30-architecture/fixtures/harness-failure-summary.fixture.json"
      - "docs/30-architecture/closed-loop-candidate-intake.riido.json"
      - "docs/30-architecture/loop-refresh-dispatch.riido.json"
      - "docs/30-architecture/fixtures/loop-refresh-commands.fixture.json"
      - "docs/30-architecture/module-decomposition.md"
      - "docs/30-architecture/module-decomposition.riido.json"

permissions:
  contents: read
  actions: write

jobs:
  dispatch:
    runs-on: ubuntu-latest
    env:
      RIIDO_LOOP_IDS: closed_loop_candidate
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: false
      - name: Verify dispatcher and sample evidence
        run: |
          mkdir -p out
          mkdir -p out/sample
          go test ./tools/looprefreshdispatch -count=1
          cp docs/30-architecture/fixtures/loop-refresh-commands.fixture.json \
            out/sample/sample-loop-refresh-commands.json
          RIIDO_HARNESS_PROMOTION_NOW=2026-06-24T12:00:00Z \
            go run ./tools/harnesspromotion \
            -summary docs/30-architecture/fixtures/harness-failure-summary.fixture.json \
            -candidate-out out/sample/sample-closed-loop-candidates.json
          RIIDO_EVIDENCE_NOW=2026-06-24T12:00:00Z \
            go run ./tools/closedloopcandidatedecision \
            -candidate-in out/sample/sample-closed-loop-candidates.json \
            -commands-out out/sample/sample-decision-refresh-commands.json
          RIIDO_EVIDENCE_NOW=2026-06-25T00:00:00Z \
            go run ./tools/looprefreshdispatch \
            -commands-in out/sample/sample-loop-refresh-commands.json \
            -commands-in out/sample/sample-decision-refresh-commands.json \
            -evidence-out out/sample/loop-refresh-dispatch-plan.json \
            -candidate-out out/sample/loop-refresh-dispatch-closed-loop-candidates.json
      - name: Use sample evidence for pull requests
        if: github.event_name == 'pull_request'
        run: |
          cp out/sample/loop-refresh-dispatch-plan.json out/loop-refresh-dispatch-plan.json
          cp out/sample/loop-refresh-dispatch-closed-loop-candidates.json out/loop-refresh-dispatch-closed-loop-candidates.json
      - name: Download live loop refresh commands
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          rm -f out/loop-refresh-dispatch-plan.json
          rm -f out/loop-refresh-dispatch-closed-loop-candidates.json
          mkdir -p out/live-loop-refresh
          download_commands() {
            local workflow="$1"
            local artifact="$2"
            local dest="$3"
            local run_id
            run_id="$(gh run list --workflow "$workflow" --branch main --status success --limit 1 --json databaseId --jq '.[0].databaseId // ""')"
            test -n "$run_id"
            mkdir -p "$dest"
            gh run download "$run_id" --name "$artifact" --dir "$dest"
          }
          download_commands loop-registry.yml loop-refresh-commands out/live-loop-refresh/registry
          download_commands closed-loop-candidate-decision.yml closed-loop-candidate-decision-commands out/live-loop-refresh/decision
          live_commands="$(find out/live-loop-refresh/registry -type f -name 'loop-refresh-commands.json' | head -n 1)"
          decision_commands="$(find out/live-loop-refresh/decision -type f -name 'closed-loop-candidate-decision-commands.json' | head -n 1)"
          test -n "$live_commands"
          test -n "$decision_commands"
          go run ./tools/looprefreshdispatch \
            -commands-in "$live_commands" \
            -commands-in "$decision_commands" \
            -evidence-out out/loop-refresh-dispatch-plan.json \
            -candidate-out out/loop-refresh-dispatch-closed-loop-candidates.json
      - name: Dispatch expired refresh workflows
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          count="$(jq -r '.dispatch_count' out/loop-refresh-dispatch-plan.json)"
          if [ "$count" = "0" ]; then
            exit 0
          fi
          {
            echo "## Loop refresh dispatch"
            echo
            jq -r '.dispatches[] |
              "- `" + .workflow_file + "` loops=`" + (.loop_ids // [] | join(",")) +
              "` claims=`" + (.claim_ids // [] | join(",")) +
              "` evidence_chains=`" + (.evidence_chain_ids // [] | join(",")) + "`"' \
              out/loop-refresh-dispatch-plan.json
          } >> "$GITHUB_STEP_SUMMARY"
          jq -r '.dispatches[] |
            [.workflow_file, (.inputs // [] | map(.name + "=" + .value) | join("\u001f")), (.loop_ids // [] | join(",")), (.claim_ids // [] | join(",")), (.evidence_chain_ids // [] | join(","))] |
            @tsv' out/loop-refresh-dispatch-plan.json |
            while IFS=$'\t' read -r workflow inputs loops claims chains; do
              echo "::notice title=Loop refresh dispatch::workflow=${workflow} loops=${loops} claims=${claims} evidence_chains=${chains}"
              args=()
              if [ -n "$inputs" ]; then
                IFS=$'\037' read -r -a pairs <<< "$inputs"
                for pair in "${pairs[@]}"; do
                  args+=("-f" "$pair")
                done
              fi
              gh workflow run "$workflow" --ref main "${args[@]}"
            done
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: loop-refresh-dispatch-plan
          path: out/loop-refresh-dispatch-plan.json
          if-no-files-found: error
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: loop-refresh-dispatch-closed-loop-candidates
          path: out/loop-refresh-dispatch-closed-loop-candidates.json
          if-no-files-found: error

name: saas-control-plane

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/saas-control-plane.yml"
      - "docs/20-domain/saas-control-plane.md"
      - "docs/20-domain/saas-control-plane.riido.json"
      - "docs/executable-knowledge.md"
      - "docs/executable-knowledge.riido.json"
      - "tools/saascontrolplane/**"
      - "tools/knowledgecoverage/**"
  pull_request:
    paths:
      - ".github/workflows/saas-control-plane.yml"
      - "docs/20-domain/saas-control-plane.md"
      - "docs/20-domain/saas-control-plane.riido.json"
      - "docs/executable-knowledge.md"
      - "docs/executable-knowledge.riido.json"
      - "tools/saascontrolplane/**"
      - "tools/knowledgecoverage/**"

jobs:
  saas-control-plane:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: false
      - name: Verify Go dependency allowlist
        run: go run ./tools/dependencyallowlist -contract dependency_allowlist.riido.json
      - name: Verify SaaS control-plane executable SSOT
        run: |
          mkdir -p out
          go test ./tools/saascontrolplane -count=1
          go run ./tools/saascontrolplane \
            -check-doc \
            -evidence-out out/saas-control-plane-evidence.json
      - name: Verify executable knowledge coverage
        run: |
          go run ./tools/knowledgecoverage \
            -check-doc \
            -evidence-out out/executable-knowledge-coverage.json
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: saas-control-plane-evidence
          path: |
            out/saas-control-plane-evidence.json
            out/executable-knowledge-coverage.json
          if-no-files-found: error

name: container-image-contract

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/container-image-contract.yml"
      - ".dockerignore"
      - "README.md"
      - "docs/20-domain/saas-control-plane.md"
      - "docs/migration/control-plane.md"
      - "go.mod"
      - "go.sum"
      - "cmd/riido_ai_server/**"
      - "internal/**"
      - "packaging/containers/**"
      - "tools/containercontract/**"
  pull_request:
    paths:
      - ".github/workflows/container-image-contract.yml"
      - ".dockerignore"
      - "README.md"
      - "docs/20-domain/saas-control-plane.md"
      - "docs/migration/control-plane.md"
      - "go.mod"
      - "go.sum"
      - "cmd/riido_ai_server/**"
      - "internal/**"
      - "packaging/containers/**"
      - "tools/containercontract/**"

jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: false
      - name: Verify Go dependency allowlist
        run: go run ./tools/dependencyallowlist -contract dependency_allowlist.riido.json
      - name: Verify container import boundary
        run: |
          disallowed="$(go list -deps -f '{{if not .Standard}}{{.ImportPath}}{{end}}' ./cmd/riido_ai_server ./tools/containercontract | grep -E 'github.com/teamswyg/riido_daemon|github.com/teamswyg/riido-daemon|github.com/aws|internal/(dynamodb|terraform|infra)' || true)"
          if [ -n "$disallowed" ]; then
            printf 'Disallowed container contract imports:\n%s\n' "$disallowed"
            exit 1
          fi
      - name: Test container contract verifier
        run: go test ./tools/containercontract -count=1
      - name: Verify container image contract
        run: |
          mkdir -p out
          go run ./tools/containercontract \
            -contract packaging/containers/riido_ai_server_container.riido.json \
            -evidence-out out/container-image-contract-evidence.json
      - name: Build container image
        run: docker build -f packaging/containers/riido_ai_server.Dockerfile -t riido-control-plane:ci .
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: container-image-contract-evidence
          path: out/container-image-contract-evidence.json
          if-no-files-found: error

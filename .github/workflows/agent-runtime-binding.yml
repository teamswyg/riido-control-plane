name: agent-runtime-binding

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/agent-runtime-binding.yml"
      - "docs/20-domain/agent-runtime-binding.md"
      - "docs/20-domain/agent-runtime-binding.riido.json"
      - "docs/migration/control-plane.md"
      - "tools/agentruntimebinding/**"
      - "go.mod"
      - "go.sum"
      - "internal/riidoaiserver/doc.go"
      - "internal/riidoaiserver/assignment_api.go"
      - "internal/riidoaiserver/agent_registry.go"
      - "internal/riidoaiserver/agent_registry_test.go"
      - "internal/riidoaiserver/ai_agent_daemon_binding_lookup.go"
      - "internal/riidoaiserver/device_runtime_liveness_binding_test.go"
      - "internal/riidoaiserver/device_daemon_poll_stale_binding_test.go"
      - "internal/riidoaiserver/device_daemon_poll_unavailable_binding_test.go"
  pull_request:
    paths:
      - ".github/workflows/agent-runtime-binding.yml"
      - "docs/20-domain/agent-runtime-binding.md"
      - "docs/20-domain/agent-runtime-binding.riido.json"
      - "docs/migration/control-plane.md"
      - "tools/agentruntimebinding/**"
      - "go.mod"
      - "go.sum"
      - "internal/riidoaiserver/doc.go"
      - "internal/riidoaiserver/assignment_api.go"
      - "internal/riidoaiserver/agent_registry.go"
      - "internal/riidoaiserver/agent_registry_test.go"
      - "internal/riidoaiserver/ai_agent_daemon_binding_lookup.go"
      - "internal/riidoaiserver/device_runtime_liveness_binding_test.go"
      - "internal/riidoaiserver/device_daemon_poll_stale_binding_test.go"
      - "internal/riidoaiserver/device_daemon_poll_unavailable_binding_test.go"

jobs:
  guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: false
      - name: Verify Go dependency allowlist
        run: go run ./tools/dependencyallowlist -contract dependency_allowlist.riido.json
      - name: Verify binding import boundary
        run: |
          disallowed="$(go list -deps -f '{{if not .Standard}}{{.ImportPath}}{{end}}' ./internal/riidoaiserver | grep -E 'github.com/teamswyg/riido_daemon|github.com/teamswyg/riido-daemon|github.com/aws|internal/(dynamodb|terraform|infra)' || true)"
          if [ -n "$disallowed" ]; then
            printf 'Disallowed binding imports:\n%s\n' "$disallowed"
            exit 1
          fi
      - name: Verify binding executable SSOT
        run: |
          mkdir -p out
          go test ./tools/agentruntimebinding -count=1
          go run ./tools/agentruntimebinding \
            -check-doc \
            -evidence-out out/agent-runtime-binding-evidence.json
      - name: Test agent runtime binding
        run: go test ./internal/riidoaiserver -run 'StaticAgentRegistry|ValidateAssignmentBinding|ValidateDaemonBinding|DaemonPoll' -count=1
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: agent-runtime-binding-evidence
          path: out/agent-runtime-binding-evidence.json
          if-no-files-found: error

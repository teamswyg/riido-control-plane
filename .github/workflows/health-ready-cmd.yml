name: health-ready-cmd

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/health-ready-cmd.yml"
      - "docs/20-domain/saas-control-plane.md"
      - "docs/migration/control-plane.md"
      - "go.mod"
      - "go.sum"
      - "cmd/riido_ai_server/main.go"
      - "cmd/riido_ai_server/main_test.go"
      - "internal/riidoaiserver/agent_registry.go"
      - "internal/riidoaiserver/assignment_api.go"
      - "internal/riidoaiserver/authorization.go"
      - "internal/riidoaiserver/external_authorizer.go"
      - "internal/riidoaiserver/health_http_test.go"
      - "internal/riidoaiserver/server.go"
      - "internal/riidoaiserver/store.go"
      - "internal/riidoaiserver/store_port.go"
  pull_request:
    paths:
      - ".github/workflows/health-ready-cmd.yml"
      - "docs/20-domain/saas-control-plane.md"
      - "docs/migration/control-plane.md"
      - "go.mod"
      - "go.sum"
      - "cmd/riido_ai_server/main.go"
      - "cmd/riido_ai_server/main_test.go"
      - "internal/riidoaiserver/agent_registry.go"
      - "internal/riidoaiserver/assignment_api.go"
      - "internal/riidoaiserver/authorization.go"
      - "internal/riidoaiserver/external_authorizer.go"
      - "internal/riidoaiserver/health_http_test.go"
      - "internal/riidoaiserver/server.go"
      - "internal/riidoaiserver/store.go"
      - "internal/riidoaiserver/store_port.go"

jobs:
  health-cmd:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false
      - name: Verify no non-Riido Go dependencies
        run: |
          allowed="github.com/teamswyg/riido-contracts"
          disallowed="$(go list -m all | awk -v allowed="$allowed" 'NR > 1 && $1 != allowed { print $1 }')"
          if [ -n "$disallowed" ]; then
            printf 'Disallowed Go dependencies:\n%s\n' "$disallowed"
            exit 1
          fi
      - name: Verify health/cmd import boundary
        run: |
          disallowed="$(go list -deps -f '{{if not .Standard}}{{.ImportPath}}{{end}}' ./cmd/riido_ai_server ./internal/riidoaiserver | grep -E 'github.com/teamswyg/riido_daemon|github.com/teamswyg/riido-daemon|github.com/aws|internal/(dynamodb|terraform|infra)' || true)"
          if [ -n "$disallowed" ]; then
            printf 'Disallowed health/cmd imports:\n%s\n' "$disallowed"
            exit 1
          fi
      - name: Test health adapter
        run: go test ./internal/riidoaiserver -run 'HTTPHealth|HTTPReady|HealthAndReady' -count=1
      - name: Test command environment
        run: go test ./cmd/riido_ai_server -count=1
      - name: Build command
        run: go build -o /tmp/riido_ai_server ./cmd/riido_ai_server

name: ai-agent-client-testnet-load

on:
  workflow_dispatch:
    inputs:
      scenario:
        description: "public or client-read"
        required: true
        default: client-read
      duration:
        description: "Go duration, for example 60s"
        required: true
        default: 60s
      concurrency:
        description: "Concurrent workers"
        required: true
        default: "64"
  schedule:
    - cron: "37 19 * * *"

concurrency:
  group: ai-agent-client-testnet-load
  cancel-in-progress: false

jobs:
  load:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      RIIDO_LOOP_IDS: ai_agent_load_harness
      TESTNET_BASE_URL: ${{ vars.RIIDO_AI_SERVER_TESTNET_BASE_URL }}
      TESTNET_TOKEN: ${{ secrets.RIIDO_AI_SERVER_TESTNET_TOKEN }}
      TESTNET_WORKSPACE_ID: ${{ vars.RIIDO_AI_SERVER_TESTNET_WORKSPACE_ID }}
      LOAD_SCENARIO: ${{ github.event_name == 'workflow_dispatch' && inputs.scenario || 'client-read' }}
      LOAD_DURATION: ${{ github.event_name == 'workflow_dispatch' && inputs.duration || '60s' }}
      LOAD_CONCURRENCY: ${{ github.event_name == 'workflow_dispatch' && inputs.concurrency || '64' }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: false

      - name: Verify load configuration
        run: |
          test -n "$TESTNET_BASE_URL"
          echo "::add-mask::$TESTNET_BASE_URL"
          echo "::add-mask::$TESTNET_TOKEN"
          if [ "$LOAD_SCENARIO" = "client-read" ]; then
            test -n "$TESTNET_TOKEN"
          fi

      - name: Run AI Agent load evidence
        run: |
          set -euo pipefail
          mkdir -p out
          workspace_id="${TESTNET_WORKSPACE_ID:-workspace-smoke}"
          go run ./tools/aiagentload \
            -base-url "${TESTNET_BASE_URL%/}" \
            -token "$TESTNET_TOKEN" \
            -workspace-id "$workspace_id" \
            -scenario "$LOAD_SCENARIO" \
            -duration "$LOAD_DURATION" \
            -concurrency "$LOAD_CONCURRENCY" \
            -evidence-out out/ai-agent-client-testnet-load.json

      - name: Publish redacted load summary evidence
        if: always()
        env:
          RIIDO_LIVE_CHECK_STATUS: ${{ job.status }}
        run: |
          mkdir -p out
          go run ./tools/liveworkflowevidence \
            -workflow ai-agent-client-testnet-load \
            -live-status "$RIIDO_LIVE_CHECK_STATUS" \
            -evidence-out out/ai-agent-client-testnet-load-redacted-summary.json

      - name: Promote load harness failures to closed-loop candidates
        if: always()
        run: |
          mkdir -p out
          go run ./tools/harnesspromotion \
            -summary out/ai-agent-client-testnet-load-redacted-summary.json \
            -candidate-out out/ai-agent-client-testnet-load-closed-loop-candidates.json

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: ai-agent-client-testnet-load
          path: out/ai-agent-client-testnet-load.json
          if-no-files-found: error

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: ai-agent-client-testnet-load-redacted-summary
          path: out/ai-agent-client-testnet-load-redacted-summary.json
          if-no-files-found: error

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: ai-agent-client-testnet-load-closed-loop-candidates
          path: out/ai-agent-client-testnet-load-closed-loop-candidates.json
          if-no-files-found: error

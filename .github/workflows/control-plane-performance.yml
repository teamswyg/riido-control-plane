name: control-plane-performance

on:
  workflow_dispatch:
  schedule:
    - cron: "53 21 * * *"
  pull_request:
    paths:
      - ".github/workflows/control-plane-performance.yml"
      - "docs/30-architecture/control-plane-performance.md"
      - "docs/30-architecture/control-plane-performance.riido.json"
      - "docs/30-architecture/control-plane-high-traffic-audit.md"
      - "docs/30-architecture/control-plane-high-traffic-audit.riido.json"
      - "docs/30-architecture/loop-registry.md"
      - "docs/30-architecture/loop-registry.riido.json"
      - "docs/30-architecture/evidence-graph.md"
      - "docs/30-architecture/evidence-graph.riido.json"
      - "docs/30-architecture/evidence/control-plane-v3-history-readonly-projection-after-2026-07-03.json"
      - "docs/30-architecture/evidence/control-plane-v3-history-message-cache-before-2026-07-03.json"
      - "docs/30-architecture/evidence/control-plane-v3-history-message-cache-after-2026-07-03.json"
      - "docs/30-architecture/evidence/control-plane-v3-history-thread-metadata-cache-after-2026-07-03.json"
      - "tools/controlplaneaudit/**"
      - "tools/controlplaneperf/**"
      - "tools/controlplanepressure/**"
      - "tools/aiagentload/**"
      - "internal/riidoaiserver/ai_agent_client_development_method_append_client_event_locked.go"
      - "internal/riidoaiserver/ai_agent_client_development_func_client_event_for_live_fanout.go"
      - "internal/riidoaiserver/ai_agent_client_development_func_client_event_for_subscriber_locked.go"
      - "internal/riidoaiserver/ai_agent_client_development_func_filter_unseen_progress_lines.go"
      - "internal/riidoaiserver/ai_agent_client_development_func_progress_lines_after.go"
      - "internal/riidoaiserver/ai_agent_client_development_func_merge_thread_progress_lines.go"
      - "internal/riidoaiserver/ai_agent_client_development_func_filter_unseen_progress_lines_test.go"
      - "internal/riidoaiserver/ai_agent_client_development_func_merge_thread_progress_lines_test.go"
      - "internal/riidoaiserver/**"
      - "go.mod"
      - "go.sum"
  push:
    branches: [main]
    paths:
      - ".github/workflows/control-plane-performance.yml"
      - "docs/30-architecture/control-plane-performance.md"
      - "docs/30-architecture/control-plane-performance.riido.json"
      - "docs/30-architecture/control-plane-high-traffic-audit.md"
      - "docs/30-architecture/control-plane-high-traffic-audit.riido.json"
      - "docs/30-architecture/evidence/control-plane-v3-history-readonly-projection-after-2026-07-03.json"
      - "docs/30-architecture/evidence/control-plane-v3-history-message-cache-before-2026-07-03.json"
      - "docs/30-architecture/evidence/control-plane-v3-history-message-cache-after-2026-07-03.json"
      - "docs/30-architecture/evidence/control-plane-v3-history-thread-metadata-cache-after-2026-07-03.json"
      - "tools/controlplaneaudit/**"
      - "tools/controlplaneperf/**"
      - "tools/controlplanepressure/**"
      - "tools/aiagentload/**"
      - "internal/riidoaiserver/ai_agent_client_development_method_append_client_event_locked.go"
      - "internal/riidoaiserver/ai_agent_client_development_func_client_event_for_live_fanout.go"
      - "internal/riidoaiserver/ai_agent_client_development_func_client_event_for_subscriber_locked.go"
      - "internal/riidoaiserver/ai_agent_client_development_func_filter_unseen_progress_lines.go"
      - "internal/riidoaiserver/ai_agent_client_development_func_progress_lines_after.go"
      - "internal/riidoaiserver/ai_agent_client_development_func_merge_thread_progress_lines.go"
      - "internal/riidoaiserver/ai_agent_client_development_func_filter_unseen_progress_lines_test.go"
      - "internal/riidoaiserver/ai_agent_client_development_func_merge_thread_progress_lines_test.go"
      - "internal/riidoaiserver/**"

jobs:
  performance:
    runs-on: ubuntu-latest
    env:
      RIIDO_LOOP_IDS: control_plane_performance_harness
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: false
      - name: Verify control-plane performance evidence loop
        run: |
          mkdir -p out
          go test ./tools/controlplaneperf -count=1
          go test ./tools/aiagentload -count=1
          go test ./tools/controlplanepressure -count=1
          go run ./tools/controlplaneperf \
            -check-doc \
            -evidence-out out/control-plane-performance-evidence.json \
            -architecture-query-path internal/riidoaiserver/http_transaction_metrics_observe.go \
            -architecture-query-path internal/riidoaiserver/server.go \
            -architecture-query-out out/control-plane-architecture-query.json
      - name: Verify high-traffic audit evidence
        run: |
          mkdir -p out
          go test ./tools/controlplaneaudit -count=1
          go run ./tools/controlplaneaudit \
            -check-doc \
            -evidence-out out/control-plane-high-traffic-audit.json
      - name: Run lightweight hot-path benchmarks
        run: |
          go test ./internal/riidoaiserver \
            -run '^$' \
            -bench 'Benchmark(HTTPTransactionMetricsObserve|StoreOperationMetricsObserve|RenderProgressMessage|RecordAIAgentThreadProgress|AIAgentTaskThreadStreamSubscriptionTargets)' \
            -benchmem \
            -benchtime=100ms \
            -count=1 > out/control-plane-performance-bench.txt
      - name: Run lightweight race/concurrency evidence
        run: |
          go test -race ./internal/riidoaiserver \
            -run 'Test(AIAgentTaskThread|Assignment|Store|DynamoDBAssignmentOperationStore|ActiveTaskThread|ProviderMulti|ToolApproval|Subscribe|Fanout)' \
            -count=1 > out/control-plane-race.txt 2>&1
      - name: Run local open-loop pressure evidence
        run: |
          go run ./tools/controlplanepressure \
            -duration 500ms \
            -concurrency 1,8,32 \
            -threads 24 \
            -lines 40 \
            -candidate-out out/control-plane-pressure-closed-loop-candidates.json \
            -evidence-out out/control-plane-local-pressure.json
      - name: Publish redacted performance summary evidence
        if: always()
        env:
          RIIDO_LIVE_CHECK_STATUS: ${{ job.status }}
        run: |
          mkdir -p out
          go run ./tools/liveworkflowevidence \
            -workflow control-plane-performance \
            -live-status "$RIIDO_LIVE_CHECK_STATUS" \
            -evidence-out out/control-plane-performance-redacted-summary.json
      - name: Promote performance harness failures to closed-loop candidates
        if: always()
        run: |
          mkdir -p out
          go run ./tools/harnesspromotion \
            -summary out/control-plane-performance-redacted-summary.json \
            -candidate-out out/control-plane-performance-closed-loop-candidates.json
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: control-plane-performance-evidence
          path: out/control-plane-performance-evidence.json
          if-no-files-found: error
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: control-plane-architecture-query
          path: out/control-plane-architecture-query.json
          if-no-files-found: error
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: control-plane-high-traffic-audit
          path: out/control-plane-high-traffic-audit.json
          if-no-files-found: error
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: control-plane-performance-bench
          path: out/control-plane-performance-bench.txt
          if-no-files-found: error
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: control-plane-race
          path: out/control-plane-race.txt
          if-no-files-found: error
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: control-plane-local-pressure
          path: out/control-plane-local-pressure.json
          if-no-files-found: error
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: control-plane-performance-redacted-summary
          path: out/control-plane-performance-redacted-summary.json
          if-no-files-found: error
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: control-plane-performance-closed-loop-candidates
          path: out/control-plane-performance-closed-loop-candidates.json
          if-no-files-found: error
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: control-plane-pressure-closed-loop-candidates
          path: out/control-plane-pressure-closed-loop-candidates.json
          if-no-files-found: error

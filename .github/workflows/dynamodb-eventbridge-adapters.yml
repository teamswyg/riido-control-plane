name: dynamodb-eventbridge-adapters

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/dynamodb-eventbridge-adapters.yml"
      - "docs/20-domain/saas-control-plane.md"
      - "docs/20-domain/saas-control-plane.riido.json"
      - "docs/migration/control-plane.md"
      - "tools/saascontrolplane/**"
      - "go.mod"
      - "go.sum"
      - "internal/riidoaiserver/dynamodb_*.go"
      - "internal/riidoaiserver/eventbridge_*.go"
  pull_request:
    paths:
      - ".github/workflows/dynamodb-eventbridge-adapters.yml"
      - "docs/20-domain/saas-control-plane.md"
      - "docs/20-domain/saas-control-plane.riido.json"
      - "docs/migration/control-plane.md"
      - "tools/saascontrolplane/**"
      - "go.mod"
      - "go.sum"
      - "internal/riidoaiserver/dynamodb_*.go"
      - "internal/riidoaiserver/eventbridge_*.go"

jobs:
  adapters:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false
      - name: Verify Go dependency allowlist
        run: go run ./tools/dependencyallowlist -contract dependency_allowlist.riido.json
      - name: Verify AWS adapter import boundary
        run: |
          disallowed="$(go list -deps -f '{{if not .Standard}}{{.ImportPath}}{{end}}' ./internal/riidoaiserver | grep -E 'github.com/teamswyg/riido_daemon|github.com/teamswyg/riido-daemon|github.com/aws|internal/(terraform|infra)' || true)"
          if [ -n "$disallowed" ]; then
            printf 'Disallowed DynamoDB/EventBridge adapter imports:\n%s\n' "$disallowed"
            exit 1
          fi
      - name: Verify no private deployment artifacts
        run: |
          forbidden="$(find . -path './.git' -prune -o \( -name '*.tfstate' -o -name '*.tfvars' -o -path './.riido-local/*' -o -path './evidence/*' \) -print)"
          if [ -n "$forbidden" ]; then
            printf 'Forbidden private deployment artifacts:\n%s\n' "$forbidden"
            exit 1
          fi
      - name: Verify adapter executable SSOT
        run: |
          mkdir -p out
          go test ./tools/saascontrolplane -count=1
          go run ./tools/saascontrolplane \
            -boundary dynamodb-eventbridge \
            -check-doc \
            -evidence-out out/dynamodb-eventbridge-adapters-evidence.json
      - name: Test DynamoDB and EventBridge adapters
        run: go test ./internal/riidoaiserver -run 'DynamoDB|EventBridge' -count=1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dynamodb-eventbridge-adapters-evidence
          path: out/dynamodb-eventbridge-adapters-evidence.json
          if-no-files-found: error

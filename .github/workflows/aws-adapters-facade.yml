name: aws-adapters-facade

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/aws-adapters-facade.yml"
      - "awsadapters/**"
      - "docs/20-domain/saas-control-plane.md"
      - "docs/20-domain/saas-control-plane.riido.json"
      - "docs/migration/control-plane.md"
      - "tools/saascontrolplane/**"
      - "go.mod"
      - "go.sum"
      - "internal/riidoaiserver/dynamodb_*.go"
      - "internal/riidoaiserver/eventbridge_*.go"
  pull_request:
    paths:
      - ".github/workflows/aws-adapters-facade.yml"
      - "awsadapters/**"
      - "docs/20-domain/saas-control-plane.md"
      - "docs/20-domain/saas-control-plane.riido.json"
      - "docs/migration/control-plane.md"
      - "tools/saascontrolplane/**"
      - "go.mod"
      - "go.sum"
      - "internal/riidoaiserver/dynamodb_*.go"
      - "internal/riidoaiserver/eventbridge_*.go"

jobs:
  facade:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false
      - name: Verify Go dependency allowlist
        run: go run ./tools/dependencyallowlist -contract dependency_allowlist.riido.json
      - name: Verify facade import boundary
        run: |
          disallowed="$(go list -deps -f '{{if not .Standard}}{{.ImportPath}}{{end}}' ./awsadapters | grep -E 'github.com/teamswyg/riido_daemon|github.com/teamswyg/riido-daemon|github.com/aws|internal/(terraform|infra)' || true)"
          if [ -n "$disallowed" ]; then
            printf 'Disallowed AWS facade imports:\n%s\n' "$disallowed"
            exit 1
          fi
      - name: Verify facade executable SSOT
        run: |
          mkdir -p out
          go test ./tools/saascontrolplane -count=1
          go run ./tools/saascontrolplane \
            -boundary aws-facade \
            -check-doc \
            -evidence-out out/aws-adapters-facade-evidence.json
      - name: Test AWS adapter facade
        run: go test ./awsadapters -count=1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: aws-adapters-facade-evidence
          path: out/aws-adapters-facade-evidence.json
          if-no-files-found: error

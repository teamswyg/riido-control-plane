name: provider-status

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/provider-status.yml"
      - "docs/20-domain/provider-status.md"
      - "docs/20-domain/provider-status.riido.json"
      - "docs/20-domain/saas-control-plane.md"
      - "docs/migration/control-plane.md"
      - "tools/providerstatus/**"
      - "go.mod"
      - "go.sum"
      - "internal/riidoaiserver/server.go"
      - "internal/riidoaiserver/server_*.go"
      - "internal/riidoaiserver/provider_status.go"
      - "internal/riidoaiserver/provider_status_port.go"
      - "internal/riidoaiserver/provider_status_test.go"
      - "internal/riidoaiserver/provider_status_http_test.go"
  pull_request:
    paths:
      - ".github/workflows/provider-status.yml"
      - "docs/20-domain/provider-status.md"
      - "docs/20-domain/provider-status.riido.json"
      - "docs/20-domain/saas-control-plane.md"
      - "docs/migration/control-plane.md"
      - "tools/providerstatus/**"
      - "go.mod"
      - "go.sum"
      - "internal/riidoaiserver/server.go"
      - "internal/riidoaiserver/server_*.go"
      - "internal/riidoaiserver/provider_status.go"
      - "internal/riidoaiserver/provider_status_port.go"
      - "internal/riidoaiserver/provider_status_test.go"
      - "internal/riidoaiserver/provider_status_http_test.go"

jobs:
  provider-status:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false
      - name: Verify Go dependency allowlist
        run: go run ./tools/dependencyallowlist -contract dependency_allowlist.riido.json
      - name: Verify provider status import boundary
        run: |
          disallowed="$(go list -deps -f '{{if not .Standard}}{{.ImportPath}}{{end}}' ./internal/riidoaiserver | grep -E 'github.com/teamswyg/riido_daemon|github.com/teamswyg/riido-daemon|github.com/aws|internal/(dynamodb|terraform|infra)' || true)"
          if [ -n "$disallowed" ]; then
            printf 'Disallowed provider status imports:\n%s\n' "$disallowed"
            exit 1
          fi
      - name: Verify provider status executable SSOT
        run: |
          mkdir -p out
          go test ./tools/providerstatus -count=1
          go run ./tools/providerstatus \
            -check-doc \
            -evidence-out out/provider-status-evidence.json
      - name: Test provider status
        run: go test ./internal/riidoaiserver -run 'ProviderStatus' -count=1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: provider-status-evidence
          path: out/provider-status-evidence.json
          if-no-files-found: error

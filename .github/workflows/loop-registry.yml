jobs:
  loop-registry:
    runs-on: ubuntu-latest
    env:
      RIIDO_LOOP_IDS: ai_thread_history closed_loop_candidate
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: false
      - name: Verify loop registry
        env:
          RIIDO_LOOP_REGISTRY_IMPACT_BASE: ${{ github.event_name == 'pull_request' && format('origin/{0}', github.base_ref) || '' }}
        run: |
          mkdir -p out
          impact_args=()
          if [ -n "$RIIDO_LOOP_REGISTRY_IMPACT_BASE" ]; then
            impact_args=(-impact-base "$RIIDO_LOOP_REGISTRY_IMPACT_BASE")
          fi
          go test ./tools/loopregistry -count=1
          go test ./tools/aiagentclientapi -run 'Test(GeneratedDocMatchesManifest|RunWritesEvidence)$' -count=1
          go test ./tools/evidencegraph ./tools/harnesspromotion ./tools/liveworkflowevidence ./tools/closedloopcandidateintake ./tools/closedloopcandidatedecision ./tools/precommitbaseline -count=1
          go test ./internal/riidoaiserver \
            -run 'Test(TaskThreadsKeepAgentSnapshotAfterAgentDeleted|TaskThreadsBackfillDeletedAgentSnapshotForLegacyRows|AssignedAgentProfilesFallbackToThreadSnapshotForDeletedActiveAgent|AIAgentTaskThreadHistoryKeepsUserFollowupMessages|PersistentAIAgentTaskThreadHistoryRestoresUserMessages|AIAgentClientSameProviderAgentsKeepDistinctAssignments|HTTPAIAgentClientProviderMultiAssignmentReplaysEachThread|AIAgentTaskThreadHistoryConversationGrouping|HTTPAIAgentClientV3ThreadHistory|AIAgentIntentDialogueScenarioStaysInConversation|AIAgentIntentDialogueScenarioKeepsProgressAndLimitResult|HTTPAIAgentIntentGateWaitsForUserBeforeDurableAssignment|HTTPAIAgentIntentDialogueV3KeepsScenarioTimeline|AssignmentPromptClassifiesIntentComponentTypes|AssignmentPromptKeepsExplicitInstructionExecutable)$' \
            -count=1
          go run ./tools/loopregistry \
            -check-doc \
            -github-annotations \
            "${impact_args[@]}" \
            -evidence-out out/loop-registry-evidence.json
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: loop-registry-evidence
          path: out/loop-registry-evidence.json
          if-no-files-found: error

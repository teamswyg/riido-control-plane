name: assignment-sse-adapter

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/assignment-sse-adapter.yml"
      - "docs/20-domain/request-authorization.md"
      - "docs/20-domain/saas-control-plane.md"
      - "docs/20-domain/saas-control-plane.riido.json"
      - "docs/migration/control-plane.md"
      - "tools/saascontrolplane/**"
      - "go.mod"
      - "go.sum"
      - "internal/riidoaiserver/assignment_api.go"
      - "internal/riidoaiserver/assignment_contract_gen.go"
      - "internal/riidoaiserver/assignment_http_test.go"
      - "internal/riidoaiserver/assignment_sse_test.go"
      - "internal/riidoaiserver/authorization.go"
      - "internal/riidoaiserver/server.go"
      - "internal/riidoaiserver/server_*.go"
      - "internal/riidoaiserver/store.go"
      - "internal/riidoaiserver/store_*.go"
      - "internal/riidoaiserver/store_actor_test.go"
      - "internal/riidoaiserver/store_port.go"
      - "internal/riidoaiserver/store_state.go"
  pull_request:
    paths:
      - ".github/workflows/assignment-sse-adapter.yml"
      - "docs/20-domain/request-authorization.md"
      - "docs/20-domain/saas-control-plane.md"
      - "docs/20-domain/saas-control-plane.riido.json"
      - "docs/migration/control-plane.md"
      - "tools/saascontrolplane/**"
      - "go.mod"
      - "go.sum"
      - "internal/riidoaiserver/assignment_api.go"
      - "internal/riidoaiserver/assignment_contract_gen.go"
      - "internal/riidoaiserver/assignment_http_test.go"
      - "internal/riidoaiserver/assignment_sse_test.go"
      - "internal/riidoaiserver/authorization.go"
      - "internal/riidoaiserver/server.go"
      - "internal/riidoaiserver/server_*.go"
      - "internal/riidoaiserver/store.go"
      - "internal/riidoaiserver/store_*.go"
      - "internal/riidoaiserver/store_actor_test.go"
      - "internal/riidoaiserver/store_port.go"
      - "internal/riidoaiserver/store_state.go"

jobs:
  assignment-sse:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false
      - name: Verify Go dependency allowlist
        run: go run ./tools/dependencyallowlist -contract dependency_allowlist.riido.json
      - name: Verify assignment SSE boundary
        run: |
          disallowed="$(go list -deps -f '{{if not .Standard}}{{.ImportPath}}{{end}}' ./internal/riidoaiserver | grep -E 'github.com/teamswyg/riido_daemon|github.com/teamswyg/riido-daemon|github.com/aws|internal/(dynamodb|terraform|infra)' || true)"
          if [ -n "$disallowed" ]; then
            printf 'Disallowed assignment SSE imports:\n%s\n' "$disallowed"
            exit 1
          fi
      - name: Verify assignment SSE executable SSOT
        run: |
          mkdir -p out
          go test ./tools/saascontrolplane -count=1
          go run ./tools/saascontrolplane \
            -boundary task-event-sse \
            -check-doc \
            -evidence-out out/assignment-sse-adapter-evidence.json
      - name: Test assignment SSE adapter
        run: go test ./internal/riidoaiserver -run 'SSE|SubscribeTask' -count=1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: assignment-sse-adapter-evidence
          path: out/assignment-sse-adapter-evidence.json
          if-no-files-found: error

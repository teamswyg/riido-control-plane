name: store-snapshot-file-outbox

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/store-snapshot-file-outbox.yml"
      - "docs/20-domain/saas-control-plane.md"
      - "docs/30-architecture/store-snapshot-file-outbox.md"
      - "docs/30-architecture/store-snapshot-file-outbox.riido.json"
      - "docs/migration/control-plane.md"
      - "go.mod"
      - "go.sum"
      - "internal/riidoaiserver/assignment_api.go"
      - "internal/riidoaiserver/doc.go"
      - "internal/riidoaiserver/file_outbox.go"
      - "internal/riidoaiserver/store.go"
      - "internal/riidoaiserver/store_*.go"
      - "internal/riidoaiserver/store_persistence_test.go"
      - "internal/riidoaiserver/store_port.go"
      - "internal/riidoaiserver/store_snapshot.go"
      - "internal/riidoaiserver/store_state.go"
      - "tools/storesnapshotoutbox/**"
  pull_request:
    paths:
      - ".github/workflows/store-snapshot-file-outbox.yml"
      - "docs/20-domain/saas-control-plane.md"
      - "docs/30-architecture/store-snapshot-file-outbox.md"
      - "docs/30-architecture/store-snapshot-file-outbox.riido.json"
      - "docs/migration/control-plane.md"
      - "go.mod"
      - "go.sum"
      - "internal/riidoaiserver/assignment_api.go"
      - "internal/riidoaiserver/doc.go"
      - "internal/riidoaiserver/file_outbox.go"
      - "internal/riidoaiserver/store.go"
      - "internal/riidoaiserver/store_*.go"
      - "internal/riidoaiserver/store_persistence_test.go"
      - "internal/riidoaiserver/store_port.go"
      - "internal/riidoaiserver/store_snapshot.go"
      - "internal/riidoaiserver/store_state.go"
      - "tools/storesnapshotoutbox/**"

jobs:
  persistence:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false
      - name: Verify Go dependency allowlist
        run: go run ./tools/dependencyallowlist -contract dependency_allowlist.riido.json
      - name: Verify persistence import boundary
        run: |
          disallowed="$(go list -deps -f '{{if not .Standard}}{{.ImportPath}}{{end}}' ./internal/riidoaiserver | grep -E 'github.com/teamswyg/riido_daemon|github.com/teamswyg/riido-daemon|github.com/aws|internal/(dynamodb|terraform|infra)' || true)"
          if [ -n "$disallowed" ]; then
            printf 'Disallowed persistence imports:\n%s\n' "$disallowed"
            exit 1
          fi
      - name: Test store snapshot and file outbox
        run: go test ./internal/riidoaiserver -run 'FileOutbox|FileStoreSnapshot|DecodeStoreSnapshot|StateFromSnapshot|OutboxFailure' -count=1
      - name: Publish store snapshot and file outbox evidence
        run: |
          mkdir -p out
          go test ./tools/storesnapshotoutbox -count=1
          go run ./tools/storesnapshotoutbox -check-doc -evidence-out out/store-snapshot-file-outbox-evidence.json
      - uses: actions/upload-artifact@v4
        with:
          name: store-snapshot-file-outbox-evidence
          path: out/store-snapshot-file-outbox-evidence.json
          if-no-files-found: error

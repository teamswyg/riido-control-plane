name: external-authorizer

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/external-authorizer.yml"
      - "docs/20-domain/request-authorization.md"
      - "docs/20-domain/agent-catalog-rbac.md"
      - "docs/migration/control-plane.md"
      - "go.mod"
      - "go.sum"
      - "internal/riidoaiserver/doc.go"
      - "internal/riidoaiserver/authorization.go"
      - "internal/riidoaiserver/authorization_test.go"
      - "internal/riidoaiserver/agent_catalog_rbac.go"
      - "internal/riidoaiserver/external_authorizer.go"
      - "internal/riidoaiserver/external_authorizer_test.go"
  pull_request:
    paths:
      - ".github/workflows/external-authorizer.yml"
      - "docs/20-domain/request-authorization.md"
      - "docs/20-domain/agent-catalog-rbac.md"
      - "docs/migration/control-plane.md"
      - "go.mod"
      - "go.sum"
      - "internal/riidoaiserver/doc.go"
      - "internal/riidoaiserver/authorization.go"
      - "internal/riidoaiserver/authorization_test.go"
      - "internal/riidoaiserver/agent_catalog_rbac.go"
      - "internal/riidoaiserver/external_authorizer.go"
      - "internal/riidoaiserver/external_authorizer_test.go"

jobs:
  adapter:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false
      - name: Verify Go dependency allowlist
        run: go run ./tools/dependencyallowlist -contract dependency_allowlist.riido.json
      - name: Verify external authorizer import boundary
        run: |
          disallowed="$(go list -deps -f '{{if not .Standard}}{{.ImportPath}}{{end}}' ./internal/riidoaiserver | grep -E 'github.com/teamswyg/riido_daemon|github.com/teamswyg/riido-daemon|github.com/aws|internal/(dynamodb|terraform|infra)' || true)"
          if [ -n "$disallowed" ]; then
            printf 'Disallowed external authorizer imports:\n%s\n' "$disallowed"
            exit 1
          fi
      - name: Test external authorizer
        run: go test ./internal/riidoaiserver -run 'ExternalHTTPAuthorizer|FallbackAuthorizer' -count=1
